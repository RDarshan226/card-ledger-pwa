<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14110d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Card Ledger</title>
<style>
  #startup-splash{animation:startupFailsafe 1.15s ease forwards;} @keyframes startupFailsafe{0%,78%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden;pointer-events:none}}
  :root{
    --paper:#080B12; --paper-card:#101622; --line:#26344A; --line-soft:#1B2739;
    --margin:#00F5FF; --ink:#F2F7FF; --ink-soft:#93A4BD;
    --brass:#00E5FF; --gold:#B8FF00; --gold-bright:#D7FF66;
    --neon-pink:#FF2BD6; --neon-purple:#9B5CFF;
    --danger:#FF4D6D; --danger-soft:#351523; --ok:#39FFB6; --ok-soft:#102F2A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(850px 520px at 8% -10%, rgba(0,245,255,.14), transparent 62%),
      radial-gradient(800px 500px at 100% 4%, rgba(255,43,214,.12), transparent 58%),
      radial-gradient(700px 500px at 50% 100%, rgba(155,92,255,.08), transparent 60%),
      var(--paper);
    background-attachment:fixed;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:0 0 80px;
  }
  .margin-rule{ position:fixed; top:0; bottom:0; left:64px; width:1px; background:linear-gradient(var(--margin), transparent 90%); opacity:.3; z-index:0; }
  @media (max-width:640px){ .margin-rule{ left:28px; } }

  .wrap{ max-width:920px; margin:0 auto; padding:40px 32px 0; position:relative; z-index:1; }
  @media (max-width:640px){ .wrap{ padding:28px 16px 0; } }

  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass); }
  .top-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}.app-version{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid rgba(0,229,255,.45);border-radius:999px;background:rgba(0,229,255,.08);color:var(--brass);font:600 10px "IBM Plex Mono",monospace;letter-spacing:.08em;white-space:nowrap;box-shadow:0 0 12px rgba(0,229,255,.10)}@media(max-width:520px){.app-version{font-size:9px;padding:4px 7px}}\n  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:38px; margin:4px 0 18px; letter-spacing:-0.01em;
    background:linear-gradient(100deg, var(--ink) 30%, var(--brass) 65%, var(--gold) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent; width:fit-content;
  }


  [data-theme="light"]{
    --paper:#F5F8FF;--paper-card:#FFFFFF;--line:#B9C9DE;--line-soft:#DCE5F2;
    --margin:#007CFF;--ink:#101828;--ink-soft:#52637A;--brass:#008CFF;
    --gold:#B6F500;--gold-bright:#D8FF63;--neon-pink:#E51BBE;--neon-purple:#7440E8;
    --danger:#D92D52;--danger-soft:#FCE7EC;--ok:#079669;--ok-soft:#E5FAF3;
  }
  [data-theme="light"] body{
    background:radial-gradient(850px 520px at 8% -10%,rgba(0,140,255,.13),transparent 62%),
      radial-gradient(800px 500px at 100% 4%,rgba(229,27,190,.10),transparent 58%),
      radial-gradient(700px 500px at 50% 100%,rgba(116,64,232,.07),transparent 60%),var(--paper);
  }

  /* ---- Secure update panel ---- */
  .chat-panel{margin-top:14px;}
  .chat-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px;}
  .chat-kicker{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--brass);margin-bottom:3px;}
  .secure-badge{white-space:nowrap;padding:6px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font:600 10px 'IBM Plex Mono',monospace;}
  .chat-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px;}
  .chat-steps>div{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--paper-card);font-size:11px;color:var(--ink-soft);}
  .chat-steps b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#5C3D06;font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
  .chat-section{padding:14px;border:1px solid var(--line-soft);border-radius:13px;background:var(--paper-card);}
  .chat-section-title{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .chat-section-title strong{display:block;font-family:'Fraunces',serif;font-size:16px;}
  .chat-section-title small,.chat-output-head small{display:block;color:var(--ink-soft);font-size:10.5px;margin-top:2px;}
  .chat-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(120deg,var(--gold-bright),var(--gold));font-weight:700;color:#5C3D06;}
  .chat-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .chat-choice{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper-card);cursor:pointer;}
  .chat-choice:has(input:checked){border-color:var(--brass);box-shadow:0 0 0 2px rgba(224,149,42,.12);background:var(--paper-card);}
  .chat-choice input{accent-color:var(--brass);}
  .chat-choice b{display:block;font-size:12px;}.chat-choice small{display:block;color:var(--ink-soft);font-size:9.5px;margin-top:2px;}
  .chat-form{display:grid;grid-template-columns:1.25fr .9fr .9fr 1fr 1fr;gap:9px;align-items:end;}
  .chat-form .field{min-width:0;}.chat-form .field label{display:block;margin:0 0 4px 2px;font:600 9px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .chat-form .field label em{font-style:normal;text-transform:none;letter-spacing:0;opacity:.7;}
  .chat-form input,.chat-form select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-card);font:12px Inter,sans-serif;color:var(--ink);}
  .chat-form input:focus,.chat-form select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .chat-wide{grid-column:span 1;}
  .chat-primary,.chat-secondary{margin-top:11px;border:0;border-radius:8px;padding:10px 14px;font:600 11px 'IBM Plex Mono',monospace;cursor:pointer;}
  .chat-primary{background:linear-gradient(120deg,var(--brass),var(--gold));color:#3A2705;box-shadow:0 6px 16px -8px rgba(224,149,42,.7);}
  .chat-secondary{background:#FFF3D2;color:#6B480A;border:1px solid var(--line);}
  .chat-divider{display:flex;align-items:center;gap:10px;margin:13px 0;color:var(--ink-soft);font:10px 'IBM Plex Mono',monospace;}.chat-divider:before,.chat-divider:after{content:'';height:1px;background:var(--line-soft);flex:1;}
  .chat-output{margin-top:13px;padding:13px;border-radius:12px;background:#070B12;color:#DFFBFF;box-shadow:0 0 24px rgba(0,229,255,.08) inset;}
  .chat-output-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;}.chat-output-head strong{font-size:12px;}.chat-output-head span{font:600 9px 'IBM Plex Mono',monospace;padding:3px 6px;border:1px solid #725c38;border-radius:5px;}
  #chat-encrypted{width:100%;min-height:70px;padding:9px;border:1px solid #725c38;border-radius:7px;background:#05080D;color:#CFFFF8;font:10px 'IBM Plex Mono',monospace;word-break:break-all;resize:vertical;}
  .chat-copy{margin-top:7px;width:100%;padding:9px;border:1px solid #8A6B35;border-radius:7px;background:#111C2B;color:#CFFFF8;font:600 11px 'IBM Plex Mono',monospace;cursor:pointer;}
  .chat-help{margin-top:11px;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px;font-size:11px;color:var(--ink-soft);}.chat-help summary{cursor:pointer;color:var(--ink);font-weight:600;}.chat-help ol{margin:8px 0 2px;padding-left:20px;line-height:1.6;}
  .chat-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .github-sync-box{margin-top:12px;padding:12px;border:1px solid var(--line-soft);border-radius:11px;background:linear-gradient(135deg,rgba(0,245,255,.055),rgba(155,92,255,.045));}
  .github-sync-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .github-sync-head strong{display:block;font-size:12px;}
  .github-sync-head small{display:block;color:var(--ink-soft);font-size:10.5px;margin-top:3px;line-height:1.45;}
  .github-status{margin-top:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-card);font:600 10px 'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .github-status.connected{color:var(--ok);border-color:rgba(57,255,182,.4);background:var(--ok-soft);}
  .github-status.error{color:var(--danger);border-color:rgba(255,77,109,.4);background:var(--danger-soft);}
  .github-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .github-actions .tab-btn{flex:1 1 150px;}
  @media(max-width:700px){.chat-head{flex-direction:column;}.chat-steps{grid-template-columns:1fr;gap:6px;}.chat-form{grid-template-columns:1fr 1fr;}.chat-form .chat-wide{grid-column:span 2;}.chat-type-grid{grid-template-columns:1fr;}.chat-primary,.chat-secondary{width:100%;}.chat-actions .tab-btn{flex:1 1 100%;}.github-actions .tab-btn{flex:1 1 100%;}}

  /* ---- Tabs ---- */
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 20px; }
  .tabs .tab-btn{ flex:1 1 calc(25% - 6px); text-align:center; }
  @media (max-width:520px){ .tabs .tab-btn{ flex:1 1 calc(50% - 6px); } }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px; }
  .table-scroll table.analysis{ min-width:560px; }
  .tab-btn{
    padding:9px 18px; border-radius:9px; border:1px solid var(--line); background:var(--paper-card);
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; cursor:pointer; color:var(--ink-soft);
    transition:box-shadow .15s ease, background .15s ease, color .15s ease;
  }
  .tab-btn:hover{ box-shadow:0 4px 14px -6px rgba(224,149,42,.5); }
  /* All buttons INSIDE tabs are cyan-blue; navigation .tab-btn buttons stay unchanged. */
  #app button{
    background:linear-gradient(135deg,#00CFFF,#007BFF)!important;
    color:#FFFFFF!important;
    border:1px solid rgba(255,255,255,.22)!important;
    box-shadow:0 0 10px rgba(0,191,255,.22)!important;
  }
  #app button:hover{
    color:#FFFFFF!important;
    box-shadow:0 0 14px rgba(0,191,255,.38)!important;
  }

  /* Unified cyan-blue button treatment across the app */
  button,.btn,.primary,.edit-btn,.del,.sort-btn,.fee-track-btn,.chat-primary,.chat-secondary,
  .due-toolbar button,.due-form button,.due-actions button,.entry-form button,.card-entry-form button,
  .notify-actions button,.main-sync{
    background:linear-gradient(135deg,#00CFFF,#007BFF)!important;
    color:#FFFFFF!important;
    border:1px solid rgba(255,255,255,.22)!important;
    box-shadow:0 0 10px rgba(0,191,255,.22)!important;
  }
  button:hover,.btn:hover,.primary:hover,.edit-btn:hover,.del:hover,.sort-btn:hover,
  .fee-track-btn:hover,.chat-primary:hover,.chat-secondary:hover,.due-toolbar button:hover,
  .due-form button:hover,.due-actions button:hover,.entry-form button:hover,.card-entry-form button:hover,
  .notify-actions button:hover,.main-sync:hover{
    background:linear-gradient(135deg,#19D8FF,#0088FF)!important;
    color:#FFFFFF!important;
    box-shadow:0 0 16px rgba(0,191,255,.38)!important;
  }
  /* Navigation tabs: inactive and active states are deliberately different. */
  .tabs > .tab-btn{ background:linear-gradient(135deg,#172231,#26364A)!important; color:#B8C7D9!important; border:1px solid rgba(0,207,255,.22)!important; box-shadow:none!important; }
  .tabs > .tab-btn:hover{ background:linear-gradient(135deg,#203247,#30475F)!important; color:#EAF8FF!important; border-color:rgba(0,207,255,.48)!important; }
  .tabs > .tab-btn.active{ background:linear-gradient(135deg,#00E5FF,#008CFF)!important; color:#FFFFFF!important; border-color:rgba(0,207,255,.95)!important; box-shadow:0 0 16px rgba(0,191,255,.38)!important; }

  /* ---- Hero / cover ---- */
  .cover{
    display:flex; align-items:center; justify-content:space-between; gap:24px; padding:26px 28px;
    border-radius:18px; margin-bottom:22px; flex-wrap:wrap; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#111A28 0%,#0B111C 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,229,255,.45),0 0 0 1px rgba(0,229,255,.18);
  }
  .cover::after{ content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(420px 220px at 90% -20%, rgba(255,201,74,.45), transparent 70%); }
  .cover-figures{ font-family:'IBM Plex Mono', monospace; position:relative; z-index:1; }
  .cover-line{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .cover-label{ font-size:12px; color:var(--ink-soft); width:150px; text-transform:uppercase; letter-spacing:.08em; }
  .cover-amt{ font-size:22px; font-weight:600; }
  .cover-amt.total{ font-size:32px; color:var(--brass); }
  .stamp{
    width:126px; height:126px; border-radius:50%; position:relative; flex-shrink:0; z-index:1;
    display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center;
    font-family:'IBM Plex Mono',monospace; color:#7A4E12;
    background:conic-gradient(from -20deg, var(--gold-bright), var(--gold) 25%, var(--brass) 50%, var(--gold) 75%, var(--gold-bright) 100%);
    box-shadow:0 0 0 4px #101622,0 0 28px 5px rgba(0,229,255,.32),0 10px 22px -10px rgba(184,255,0,.5);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .stamp::before{ content:''; position:absolute; inset:9px; border-radius:50%; background:#FFFDF6; box-shadow:0 1px 3px rgba(0,0,0,.08) inset; }
  .stamp .pct, .stamp .cap{ position:relative; z-index:1; }
  .stamp:hover{ transform:rotate(6deg) scale(1.05); }
  .stamp .pct{ font-size:26px; font-weight:600; line-height:1; color:var(--ink); }
  .stamp .cap{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-top:4px; color:var(--ink-soft); }
  .stamp.over{ background:conic-gradient(from -20deg, #FFC8B8, var(--danger) 25%, #C23B2E 50%, var(--danger) 75%, #FFC8B8 100%); animation:pulse 1.8s ease-in-out infinite; }
  .stamp.over .pct{ color:#C23B2E; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 4px #FFFDF6, 0 0 22px 4px rgba(232,91,79,.5); } 50%{ box-shadow:0 0 0 4px #FFFDF6, 0 0 38px 10px rgba(232,91,79,.75); } }

  /* ---- Toolbar ---- */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type="text"]{ flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-family:'Inter'; font-size:13px; background:var(--paper-card); color:var(--ink); }
  .toolbar input[type="text"]:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .sort-btn{ padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:var(--paper-card); font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.03em; cursor:pointer; color:var(--ink-soft); transition:box-shadow .15s ease, background .15s ease, color .15s ease; }
  .sort-btn:hover{ box-shadow:0 4px 14px -6px rgba(224,149,42,.5); }
  .sort-btn.active{ background:linear-gradient(120deg, var(--brass), var(--gold)); color:#06100B; border-color:transparent; }

  /* ---- Ledger rows ---- */
  .section-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin:26px 0 10px; }
  .ledger{ display:flex; flex-direction:column; gap:10px; }
  .row{ border:1px solid var(--line-soft); border-radius:14px; background:var(--paper-card); overflow:hidden; transition:background .15s ease, box-shadow .2s ease, border-color .2s ease, transform .15s ease; }
  .row:hover{ background:var(--paper-card); box-shadow:0 10px 26px -16px rgba(224,149,42,.55); border-color:var(--gold); transform:translateY(-1px); }
  .row.debit-row{ border-style:dashed; }
  .row-main{ display:grid; grid-template-columns: minmax(0,1fr) auto; align-items:center; padding:16px 18px; gap:12px; cursor:pointer; }
  .row-name{ font-family:'Fraunces', serif; font-size:18px; font-weight:600; }
  .row-name .fee-type-tag{ background:linear-gradient(135deg,#00CFFF,#007BFF); color:#FFFFFF; border:1px solid rgba(255,255,255,.22); box-shadow:0 0 8px rgba(0,191,255,.2); }
  .fee-track-btn{ background:linear-gradient(135deg,#00CFFF,#007BFF)!important; color:#FFFFFF!important; border:1px solid rgba(255,255,255,.22)!important; box-shadow:0 0 12px rgba(0,191,255,.25)!important; }
  .due-toolbar button,.due-form button,.due-actions button{ background:linear-gradient(135deg,#00CFFF,#007BFF)!important; color:#FFFFFF!important; border:1px solid rgba(255,255,255,.22)!important; box-shadow:0 0 10px rgba(0,191,255,.22); }
  .due-actions button:hover{ color:#FFFFFF!important; box-shadow:0 0 14px rgba(0,191,255,.38); }
  .share-tag{ background:linear-gradient(135deg,#00CFFF,#007BFF)!important; color:#FFFFFF!important; border:1px solid rgba(0,207,255,.8); box-shadow:0 0 8px rgba(0,191,255,.22); font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.05em; text-transform:uppercase; border-radius:3px; padding:1px 6px; margin-left:8px; vertical-align:middle; }
  .row-sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .row-amts{ min-width:110px; text-align:right; font-family:'IBM Plex Mono',monospace; }
  .row-used{ font-size:17px; font-weight:600; display:flex; align-items:center; justify-content:flex-end; gap:6px; }
  .row-limit{ font-size:11px; color:var(--ink-soft); }
  .bar-track{ height:6px; background:var(--line-soft); border-radius:3px; margin-top:8px; overflow:hidden; grid-column:1/-1; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--ok), #6FD79B); border-radius:3px; transition:width .4s ease; box-shadow:0 0 8px rgba(47,163,107,.5); }
  .bar-fill.warn{ background:linear-gradient(90deg, var(--brass), var(--gold-bright)); box-shadow:0 0 8px rgba(224,149,42,.55); }
  .bar-fill.over{ background:linear-gradient(90deg, var(--danger), #FF8A75); box-shadow:0 0 10px rgba(232,91,79,.6); }
  .chevron{ font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); font-size:12px; display:inline-block; transition:transform .25s ease; }
  .chevron.open{ transform:rotate(180deg); }

  /* ---- Expanded detail ---- */
  /* Reliable card-detail toggle: hidden until the card header is tapped. */
  .detail-wrap{ display:none; }
  .detail-wrap.open{ display:block; }
  .detail-inner{ min-width:0; }
  .detail{ padding:0 18px 22px; }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; padding:14px 0 18px; border-bottom:1px dashed var(--line); margin-bottom:16px; }
  @media (max-width:520px){ .detail-grid{ grid-template-columns:1fr; } .row-main{grid-template-columns:minmax(0,1fr) auto;padding:14px 12px;gap:8px}.row-name{font-size:16px;overflow-wrap:anywhere}.row-amts{min-width:96px}.row-used{font-size:15px}.row-limit{font-size:10px}.detail{padding-left:12px;padding-right:12px} }
  .field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:4px; font-family:'IBM Plex Mono',monospace; }
  .field input, .field select{ width:100%; padding:8px 10px; border:1px solid var(--line); background:var(--paper-card); border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink); }
  .field input:focus, .field select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .share-note{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--brass); margin-top:4px; }

  .entry-form{ display:grid; grid-template-columns: auto 1fr 1fr 1fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:16px; }
  @media (max-width:760px){ .entry-form{ grid-template-columns:1fr 1fr; } }
  .entry-form select, .entry-form input{ padding:8px 8px; border:1px solid var(--line); border-radius:6px; font-family:'Inter'; font-size:12.5px; background:var(--paper-card); }
  .entry-form button{ background:linear-gradient(120deg, var(--brass), var(--gold)); color:#3A2705; border:none; border-radius:6px; padding:9px 16px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; cursor:pointer; transition:box-shadow .15s ease, transform .1s ease; box-shadow:0 6px 16px -8px rgba(224,149,42,.7); }
  .entry-form button:hover{ box-shadow:0 8px 20px -6px rgba(224,149,42,.85); }
  .entry-form button:active{ transform:scale(.96); }
  .card-entry-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:end;padding:14px 0 16px;border-bottom:1px dashed var(--line);margin-bottom:14px;}
  .card-entry-form .field{min-width:0;}.card-entry-form .field label{display:block;margin:0 0 4px 2px;font:600 9px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .card-entry-form input,.card-entry-form select{width:100%;min-width:0;min-height:40px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-card);font:12px Inter,sans-serif;color:var(--ink);}

function feeTotalFor(fee){ fee=fee||{}; return Math.round((fee.baseAmount||0) * (1 + (fee.gstPct!=null?fee.gstPct:GST_PCT)/100)); }
function feeNextDueFrom(payments){
  if(!payments || !payments.length) return todayStr(); // never paid = due now
  const latest = [...payments].sort((a,b)=> b.date.localeCompare(a.date))[0];
  const d = new Date(latest.date+'T00:00:00');
  d.setFullYear(d.getFullYear()+1);
  return d.toISOString().slice(0,10);
}
function feeNextDue(fee){
  fee = fee || {};
  if(fee.nextDueOverride) return fee.nextDueOverride;
  return feeNextDueFrom(fee.payments);
}
function feeApplicable(fee){
  return !!fee && (fee.tracked || (fee.baseAmount||0) > 0 || (fee.payments && fee.payments.length > 0) || !!fee.nextDueOverride || (fee.redemptionFeeAmount||0) > 0);
}
// Transactions logged this calendar year on a card, for waiver checks like Union Bank's.
function txnCountThisYear(card){
  const y = new Date().getFullYear();
  return (card.entries||[]).filter(e => e.type==='txn' && new Date(e.date+'T00:00:00').getFullYear()===y).length;
}
function feeIsWaived(card){
  const w = card.fee && card.fee.waiver;
  if(!w || w.type!=='transactions') return false;
  return txnCountThisYear(card) >= w.threshold;
}

const APP_VERSION='v158';
/* PWA local database layer — plain local storage only.
   Transaction data lives in the user-selected JSON file. App settings/cards remain
   in a simple local IndexedDB store; no encryption or decryption is used. */
(function(){
  const DB_NAME='card-ledger-pwa-db-plain', DB_VERSION=1, STORE='kv';
  let dbPromise;
  function openDB(){
    if(dbPromise)return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE);};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    return dbPromise;
  }
  async function rawGet(key){
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const r=db.transaction(STORE,'readonly').objectStore(STORE).get(key);
      r.onsuccess=()=>resolve(r.result==null?null:r.result);
      r.onerror=()=>reject(r.error);
    });
  }
  async function rawSet(key,value){
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(value,key);
      r.onsuccess=()=>resolve({ok:true});
      r.onerror=()=>reject(r.error);
    });
  }
  async function rawRemove(key){
    const db=await openDB();
    return await new Promise((resolve,reject)=>{
      const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(key);
      r.onsuccess=()=>resolve({ok:true});
      r.onerror=()=>reject(r.error);
    });
  }
  window.storage={
    async get(key){const value=await rawGet(key);return value==null?null:{value:String(value)};},
    async set(key,value){return rawSet(key,String(value));},
    async remove(key){return rawRemove(key);},
    async exportEncryptedText(value){return String(value);},
    async importEncryptedText(value){return typeof value==='string'?value:JSON.stringify(value);}
  };
})();

function bytesToB64(bytes){return btoa(String.fromCharCode(...bytes));}
function B64(bytes){return bytesToB64(bytes);}
function b64(bytes){return bytesToB64(bytes);}
function b64ToBytes(v){const bin=atob(v);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
function unb64(v){return b64ToBytes(v);}

async function mergeChatEntries(){
  let changed=false,failed=0,added=0,skipped=0;
  const feed=Array.isArray(chatUpdates.entries)?chatUpdates.entries:[];
  const normalizeName=name=>String(name||'').trim().toLowerCase().replace(/\s+/g,' ');
  const findLedgerCard=name=>{
    const exact=(Array.isArray(cards)?cards:[]).find(c=>c&&c.name===name); if(exact)return exact;
    const n=normalizeName(name); return (Array.isArray(cards)?cards:[]).find(c=>c&&normalizeName(c.name)===n);
  };
  for(const p of feed){
    if(!p||!p.id)continue;
    try{
      if(deletedEntryIds.has(p.id)){skipped++;continue;}
      if(p.kind==='cashback'){
        if(!cashbackLog.some(e=>e.id===p.id)){
          cashbackLog.push({id:p.id,type:p.type==='charge'?'charge':'cashback',date:p.date||todayStr(),amount:Number(p.amount)||0,category:p.category||'',platform:p.platform||'',note:p.note||'',_fresh:true});
          changed=true;added++;
        }
        continue;
      }
      if(p.kind!=='transaction'&&p.kind!=='ledger'){skipped++;continue;}
      const card=findLedgerCard(p.card); if(!card){skipped++;continue;}
      card.entries=Array.isArray(card.entries)?card.entries:[];
      if(card.entries.some(e=>e.id===p.id)){skipped++;continue;}
      const rawType=p.type||p.mainType, entryType=(rawType==='repay'||rawType==='repayment')?'repay':'txn';
      const entry={id:p.id,type:entryType,date:p.date||todayStr(),amount:Number(p.amount)||0,category:p.category||'',platform:p.platform||'',note:p.note||'',cashback:Number(p.cashback)||0,charge:Number(p.charge)||0,_fresh:true};
      card.entries.push(entry);
      if(entry.cashback>0)cashbackLog.push({id:p.id+'-cashback',card:p.card,type:'cashback',date:entry.date,amount:entry.cashback,category:'Cashback',platform:entry.platform,note:entry.note});
      if(entry.charge>0)cashbackLog.push({id:p.id+'-charge',card:p.card,type:'charge',date:entry.date,amount:entry.charge,category:'Charge paid',platform:entry.platform,note:entry.note});
      changed=true;added++;
    }catch(e){failed++;}
  }
  window.__chatSyncStatus={feedCount:feed.length,added,failed,skipped};
  return {changed,added,failed,feedCount:feed.length};
}
async function syncEncryptedChatUpdates(showResult){
  try{
    await loadChatUpdates();
    const result=await mergeChatEntries();
    if(result.added>0){
      await saveData();
      await saveCashback();
      render();
      refreshChatCardOptions();
      if(showResult) showToast(result.added+' new transaction'+(result.added===1?'':'s')+' synced');
    }else if(showResult){
      if(result.feedCount===0) showToast('Encrypted feed is empty');
      else if(result.failed===result.feedCount) showToast('Encrypted data found, but this device does not have the matching Chat encryption key. Import the recovery package that includes the Chat key.');
      else if(result.failed>0) showToast(result.decrypted+' encrypted entries read; '+result.failed+' could not be decrypted');
      else if(result.skipped===result.feedCount) showToast('Encrypted entries already synced');
      else showToast('No new encrypted transactions');
    }
    return result.added>0;
  }catch(e){
    if(showResult) showToast('Could not refresh encrypted transactions');
    return false;
  }
}

    name,

    limit:document.getElementById('new-card-limit')?.value||0,
    billingDate:document.getElementById('new-card-billing')?.value||'',
    limitGroup:document.getElementById('new-card-group')?.value||'',
    network:document.getElementById('new-card-network')?.value||'',
    tier:document.getElementById('new-card-tier')?.value||'',

    openedMonth:document.getElementById('new-card-month')?.value||0,
    openedYear:document.getElementById('new-card-year')?.value||0
  };
  const card=newCardObject(data);
  const fee=Number(document.getElementById('new-card-fee')?.value)||0;

async function saveCardDetails(id, context){
  const c=findCard(id); if(!c) return;
  const oldName=c.name;
  const name=(document.getElementById('edit-card-name-'+id)?.value||'').trim();
  if(!name){showToast('Card name cannot be empty');return;}
  if(cards.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase())){showToast('Another card already has this name');return;}
  c.name=name;
  c.isDebit=document.getElementById('edit-card-debit-'+id)?.value==='true';
  c.limit=Number(document.getElementById('edit-card-limit-'+id)?.value)||0;
  c.billingDate=(document.getElementById('edit-card-billing-'+id)?.value||'').trim();
  c.limitGroup=(document.getElementById('edit-card-group-'+id)?.value||'').trim()||null;
  c.network=(document.getElementById('edit-card-network-'+id)?.value||'').trim();
  c.tier=(document.getElementById('edit-card-tier-'+id)?.value||'').trim();
  c.bin=(document.getElementById('edit-card-bin-'+id)?.value||'').trim();
  c.openedMonth=Number(document.getElementById('edit-card-month-'+id)?.value)||0;
  c.openedYear=Number(document.getElementById('edit-card-year-'+id)?.value)||0;
  dueBills.forEach(b=>{if(b.cardId===id||b.cardName===oldName){b.cardId=id;b.cardName=name;}});
  if(oldName!==name){removedCardNames.delete(name);if(removedCardNames.has(oldName))removedCardNames.add(oldName);}
  await saveRemovedCardNames(); await saveData(); await saveDues();
  editingCardId=null; editingRewardCardId=null;
  render(); showToast('Card details updated');
}

function nextRecurringDate(p){
  const day=Number(p.day)||1, now=new Date();
  let d=new Date(now.getFullYear(),now.getMonth(),Math.min(day,daysInMonth(now.getFullYear(),now.getMonth())));
  if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())) d=new Date(now.getFullYear(),now.getMonth()+1,Math.min(day,daysInMonth(now.getFullYear(),now.getMonth()+1)));
  return d.toISOString().slice(0,10);
}

async function loadData(){
  window.__localDataRecoveryRequired=false;
  window.__localDataRecoveryReason='';
  await loadDeletedEntries();
  await loadRemovedCardNames();
  await loadRecurringPayments();
  await loadChatUpdates();
  let unifiedLocal=null;
  try{ unifiedLocal=await loadLocalDataState(); }catch(e){ unifiedLocal=null; }
  if(window.__localDataRecoveryRequired) return false;
  if(!unifiedLocal || !Array.isArray(unifiedLocal.cards) || !unifiedLocal.cards.length){
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){
          const legacyCards=JSON.parse(res.value);
          if(Array.isArray(legacyCards) && legacyCards.length) cards=legacyCards;
        }
      }
    }catch(e){ /* no legacy data available */ }
  }

  if(!cards || !cards.length){
    cards = DEFAULT_CARDS.map(name => ({ id: uid(), name, limit: 0, billingDate: '', limitGroup: null, isDebit:false, entries: [], fee: null }));
  }

  // Drop Super Money FD if it's still sitting in older saved data.
  cards = (Array.isArray(cards)?cards:[]).filter(c => c && c.name !== "Super Money FD");
  cards.forEach(c => {
    if(!c.id) c.id=uid();
    if(!Array.isArray(c.entries)) c.entries=[];
  });

  // Add any newly-introduced cards that aren't in the saved list yet.
  DEFAULT_CARDS.forEach(name => {
    if(!removedCardNames.has(name) && !cards.some(c => c.name === name)){
      cards.push({ id: uid(), name, limit: 0, billingDate: '', limitGroup: null, isDebit:false, entries: [], fee: null });
    }
  });

  // Ensure the debit/other tracking card exists.
  if(!cards.some(c => c.name === DEBIT_CARD_NAME)){
    cards.push({ id: uid(), name: DEBIT_CARD_NAME, limit: 0, billingDate: '', limitGroup: null, isDebit:true, entries: [], fee: null });
  }

  // Ensure the fee-only debit cards / insurance placeholders exist.
  FEE_ONLY_ITEMS.forEach(item => {
    if(!removedCardNames.has(item.name) && !cards.some(c => c.name === item.name)){
      cards.push({ id: uid(), name: item.name, limit: 0, billingDate: '', limitGroup: null, isDebit: item.isDebit, feeOnly: true, isInsurance: !!item.isInsurance, entries: [], fee: null });
    }
  });

  cards.forEach(c => {
    const d = DEFAULTS[c.name];
    if(!d) return;
    if(!c.limit) c.limit = d.limit;
    if(d.billingDate) c.billingDate = d.billingDate;
    if(d.limitGroup && !c.limitGroup) c.limitGroup = d.limitGroup;
  });

  // Account opening month/year, network, tier, BIN — fills in blanks only, never overwrites edits.
  cards.forEach(c => {
    const info = ACCOUNT_INFO[c.name];
    if(!info) return;
    if(!c.openedMonth) c.openedMonth = info.openedMonth;
    if(!c.openedYear) c.openedYear = info.openedYear;
    if(!c.network) c.network = info.network;
    if(!c.tier) c.tier = info.tier;
    if(!c.bin) c.bin = info.bin;
  });

  // Seed known fee history once per card (never overwrites existing fee data).
  cards.forEach(c => {
    if(c.fee) return;
    const fd = FEE_DEFAULTS[c.name];
    c.fee = {
      baseAmount: fd ? fd.baseAmount : 0,
      gstPct: fd && fd.gstPct!=null ? fd.gstPct : GST_PCT,
      rewardRatePct: fd && fd.rewardRatePct!=null ? fd.rewardRatePct : 1,
      rewardRateConfirmed: !!(fd && fd.rewardRatePct!=null),
      perTxnCapAmount: fd && fd.perTxnCapAmount ? fd.perTxnCapAmount : 0,
      voucherSurchargePct: fd && fd.voucherSurchargePct ? fd.voucherSurchargePct : 0,
      redemptionFeeAmount: fd && fd.redemptionFeeAmount ? fd.redemptionFeeAmount : 0,
      capResetBasis: fd && fd.capResetBasis ? fd.capResetBasis : 'calendar',
      surchargeRules: fd && fd.surchargeRules ? fd.surchargeRules.map(r=>({...r})) : [],
      rewardRules: fd && fd.rewardRules ? fd.rewardRules.map(r=>({...r})) : [],
      monthlyRewardCap: fd && fd.monthlyRewardCap ? fd.monthlyRewardCap : 0,
      bestCategory: '',
      nextDueOverride: fd && fd.nextDueOverride ? fd.nextDueOverride : null,
      waiver: fd && fd.waiver ? fd.waiver : null,
      payments: fd && fd.payments ? fd.payments.map(p=>({id:uid(), ...p})) : []
    };
  });
  // Defensive fee migration: older saved cards may have a partial fee object.
  // Normalise every fee field used by Card Fees before rendering that tab.
  cards.forEach(c => {
    if(!c.fee) c.fee = blankFeeForCard(c.name);
    const fd = FEE_DEFAULTS[c.name] || {};
    if(c.fee.baseAmount == null) c.fee.baseAmount = Number(fd.baseAmount)||0;
    if(c.fee.gstPct == null) c.fee.gstPct = fd.gstPct!=null ? Number(fd.gstPct) : GST_PCT;
    if(c.fee.rewardRatePct == null) c.fee.rewardRatePct = fd.rewardRatePct!=null ? Number(fd.rewardRatePct) : 1;
    if(c.fee.rewardRateConfirmed == null) c.fee.rewardRateConfirmed = !!(fd.rewardRatePct!=null);
    if(c.fee.perTxnCapAmount == null) c.fee.perTxnCapAmount = Number(fd.perTxnCapAmount)||0;
    if(c.fee.voucherSurchargePct == null) c.fee.voucherSurchargePct = Number(fd.voucherSurchargePct)||0;
    if(c.fee.redemptionFeeAmount == null) c.fee.redemptionFeeAmount = Number(fd.redemptionFeeAmount)||0;
    if(c.fee.capResetBasis == null) c.fee.capResetBasis = fd.capResetBasis || 'calendar';
    if(!Array.isArray(c.fee.surchargeRules)) c.fee.surchargeRules = [];
    if(!Array.isArray(c.fee.rewardRules)) c.fee.rewardRules = [];
    if(!Array.isArray(c.fee.payments)) c.fee.payments = [];
    c.fee.payments = c.fee.payments.filter(p=>p && typeof p==='object').map(p=>({id:p.id||uid(),date:String(p.date||''),amount:Number(p.amount)||0}));
    if(c.fee.monthlyRewardCap == null) c.fee.monthlyRewardCap = Number(fd.monthlyRewardCap)||0;
    if(c.fee.bestCategory == null) c.fee.bestCategory = '';
    if(c.fee.nextDueOverride === undefined) c.fee.nextDueOverride = fd.nextDueOverride || null;
    if(c.fee.waiver === undefined) c.fee.waiver = fd.waiver || null;
    if(c.fee.tracked == null) c.fee.tracked = false;
  });

  // Migrate any already-saved cards that predate rewardRules/monthlyRewardCap/perTxnCapAmount/
  // voucherSurchargePct, or whose rule set has grown since it was first seeded (matched by rule id,
  // so hand-added custom rules from the UI are preserved).
  cards.forEach(c => {
    if(!c.fee) return;
    const fd = FEE_DEFAULTS[c.name];
    if(c.fee.rewardRules == null) c.fee.rewardRules = [];
    if(c.fee.surchargeRules == null) c.fee.surchargeRules = [];
    if(fd && fd.surchargeRules){
      fd.surchargeRules.forEach(r => {
        if(!c.fee.surchargeRules.some(existing => existing.platform && r.platform && existing.platform.toLowerCase()===r.platform.toLowerCase())){
          c.fee.surchargeRules.push({...r});
        }
      });
    }
    if(fd && fd.rewardRules){
      fd.rewardRules.forEach(r => {
        if(!c.fee.rewardRules.some(existing => existing.id === r.id)){
          c.fee.rewardRules.push({...r});
        }
      });
    }
    if(c.fee.monthlyRewardCap == null) c.fee.monthlyRewardCap = (fd && fd.monthlyRewardCap) || 0;
    if(c.fee.perTxnCapAmount == null) c.fee.perTxnCapAmount = (fd && fd.perTxnCapAmount) || 0;
    if(c.fee.voucherSurchargePct == null) c.fee.voucherSurchargePct = (fd && fd.voucherSurchargePct) || 0;
    if(c.fee.redemptionFeeAmount == null) c.fee.redemptionFeeAmount = (fd && fd.redemptionFeeAmount) || 0;
    if(c.fee.capResetBasis == null) c.fee.capResetBasis = (fd && fd.capResetBasis) || 'calendar';
    if(!c.fee.rewardRateConfirmed && fd && fd.rewardRatePct!=null){
      c.fee.rewardRatePct = fd.rewardRatePct;
      c.fee.rewardRateConfirmed = true;
    }
  });

  // IDFC Power+ renews every 2 years, not annually — pin its next due date
  // to 2028 (won't touch it again once you've set/edited it yourself).
  const powerPlus = cards.find(c => c.name === "IDFC Power+");
  if(powerPlus && powerPlus.fee && !powerPlus.fee.nextDueOverride){
    powerPlus.fee.nextDueOverride = "2028-08-20";
  }

  // Both SBI cards' annual fee actually falls on 7 September every year, not 8 August —
  // and both have now been paid this cycle (8 Sept 2026).
  const tataNeuFee = cards.find(c => c.name === "SBI Tata Neu Plus");
  if(tataNeuFee && tataNeuFee.fee){
    tataNeuFee.fee.nextDueOverride = "2027-09-07";
    if(!tataNeuFee.fee.payments.some(p => p.date === "2026-09-08")){
      tataNeuFee.fee.payments.push({ id: uid(), date: "2026-09-08", amount: 588.82 });
    }
  }
  const simplyClickFee = cards.find(c => c.name === "SBI SimplyClick");
  if(simplyClickFee && simplyClickFee.fee){
    simplyClickFee.fee.nextDueOverride = "2027-09-07";
    if(!simplyClickFee.fee.payments.some(p => p.date === "2026-09-08")){
      simplyClickFee.fee.payments.push({ id: uid(), date: "2026-09-08", amount: 589 });
    }
  }

  // DCB Niyo Credit's billing date corrected to 21st.
  const niyoCredit = cards.find(c => c.name === "DCB Niyo Credit");
  if(niyoCredit && niyoCredit.billingDate === "18th"){
    niyoCredit.billingDate = "21st";
  }

  // SBI SimplyClick and both BOB Uni GoldX variants actually bill on the 7th, not the 8th.
  cards.forEach(c => {
    if((c.name === "SBI SimplyClick" || c.name === "BOB Uni GoldX (Visa)" || c.name === "BOB Uni GoldX (RuPay)") && c.billingDate === "8th"){
      c.billingDate = "7th";
    }
  });

  // SBI SimplyClick and SBI Tata Neu Plus share one ₹74,000 limit.
  const simplyClick = cards.find(c => c.name === "SBI SimplyClick");
  const tataNeu = cards.find(c => c.name === "SBI Tata Neu Plus");
  if(simplyClick && !simplyClick.limitGroup){
    simplyClick.limitGroup = "sbi-shared";
    simplyClick.limit = 74000;
  }
  if(tataNeu && !tataNeu.limitGroup){
    tataNeu.limitGroup = "sbi-shared";
    tataNeu.limit = 74000;
  }

  // One-time cleanup: strip any leftover demo/trial entries from before.
  cards.forEach(c => {
    c.entries=(Array.isArray(c.entries)?c.entries:[]).filter(e => e && e.note !== 'demo');
  });

  // Cancelled: Union Bank entries for 29 Aug – 1 Sept — remove any of those
  // that already merged in before this correction, so they don't linger.
  const CANCELLED_UNION_DAILY_FROM = '2026-08-29', CANCELLED_UNION_DAILY_TO = '2026-09-01';
  cards.forEach(c => {
    if(c.name !== 'Union Bank Rupay Platinum') return;
    c.entries=(Array.isArray(c.entries)?c.entries:[]).filter(e => {
      const id=String(e&&e.id||'');
      return !(id.indexOf('union-plat-2026') === 0 && e.date >= CANCELLED_UNION_DAILY_FROM && e.date <= CANCELLED_UNION_DAILY_TO);
    });
  });

  let addedAny = await mergeChatEntries();
  SEED_ENTRIES.forEach(seed => {
    const card = cards.find(c => c.name === seed.card);
    if(!card || deletedEntryIds.has(seed.id)) return;
    const existing = card.entries.find(e => e.id === seed.id);
    if(!existing){
      card.entries.push({ id: seed.id, type: seed.type, date: seed.date, amount: seed.amount, note: seed.note || '', category: seed.category || '', platform: seed.platform || '', rewardRatePct: seed.rewardRatePct!=null ? seed.rewardRatePct : null, rewardAmountOverride: seed.rewardAmountOverride!=null ? seed.rewardAmountOverride : null, surchargeAmount: seed.surchargeAmount!=null ? seed.surchargeAmount : null });
      addedAny = true;
    } else {
      if(seed.rewardRatePct!=null && existing.rewardRatePct !== seed.rewardRatePct){ existing.rewardRatePct = seed.rewardRatePct; addedAny = true; }
      if(seed.rewardAmountOverride!=null && existing.rewardAmountOverride !== seed.rewardAmountOverride){ existing.rewardAmountOverride = seed.rewardAmountOverride; addedAny = true; }
      if(seed.surchargeAmount!=null && existing.surchargeAmount !== seed.surchargeAmount){ existing.surchargeAmount = seed.surchargeAmount; addedAny = true; }
      if(seed.date && existing.date !== seed.date){ existing.date = seed.date; addedAny = true; }
      if(seed.amount!=null && existing.amount !== seed.amount){ existing.amount = seed.amount; addedAny = true; }
    }
  });

  await saveData();
  return addedAny;
}

    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(CASHBACK_KEY, false);
        if(res && res.value){ cashbackLog = JSON.parse(res.value); }
      }
    }catch(_e){ /* no data yet, or storage unavailable */ }
  }

  if(!cashbackLog || !cashbackLog.length){
    cashbackLog = [{
      id: 'opening-net', type: 'cashback', category: 'Opening Balance',
      amount: 3940.36, date: todayStr(),
      note: 'Net cashback position as provided'
    }];
  }

  // Cancelled: the Union Bank daily auto-log's fee entries beyond 1 Sept.
  const beforeLen = cashbackLog.length;
  cashbackLog = (Array.isArray(cashbackLog)?cashbackLog:[]).filter(e => {
    const id=String(e&&e.id||'');
    return !(id.indexOf('cb-union-plat-fee-2026') === 0 && e.date >= '2026-08-29' && e.date <= '2026-09-01');
  });
  let changed = cashbackLog.length !== beforeLen;

  SEED_CASHBACK.forEach(seed => {
    if(!cashbackLog.some(e => e.id === seed.id)){
      cashbackLog.push({ ...seed });
      changed = true;
    }
  });

  if(changed) await saveCashback();
}

async function writeAutoBackup(){
  try{
    await window.storage.set(BACKUP_KEY, JSON.stringify({version:2,savedAt:new Date().toISOString(),cards,dueBills,cashbackLog,recurringPayments,removedCardNames:[...removedCardNames]}), false);
    const el=document.getElementById('saveStatus'); if(el) el.textContent='Saved locally · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    return true;
  }catch(e){ const el=document.getElementById('saveStatus'); if(el) el.textContent='Local save error'; return false; }
}

async function saveCashback(){
  try{ if(await saveUnifiedLocalData()){ try{await writeAutoBackup();}catch(_e){} return true; } }catch(e){}
  for(let attempt=0; attempt<2; attempt++){
    try{ await window.storage.set(CASHBACK_KEY, JSON.stringify(cashbackLog), false); await writeAutoBackup(); return true; }
    catch(e){ if(attempt===1) showToast('Could not save — changes kept for this session only'); }
  }
  return false;
}

async function saveData(){
  let localSaved=false;
  try{ localSaved=await saveUnifiedLocalData(); }catch(e){}
  try{
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, JSON.stringify(cards), false);
      try{ await writeAutoBackup(); }catch(_e){}
      return true;
    }
  }catch(e){}
  if(localSaved) return true;
  showToast('Could not save — changes kept for this session only');
  return false;
}

function utilised(card){ return (Array.isArray(card&&card.entries)?card.entries:[]).reduce((sum,e)=> sum + (e.type==='txn' ? (Number(e.amount)||0) : -(Number(e.amount)||0)), 0); }

function applyTheme(theme){

  try{localStorage.setItem('card-ledger-theme-v1',chosen);}catch(e){}

function toggleTheme(){

function initTheme(){

function renderLedger(){
  const app = document.getElementById('app');
  if(!app) return;
  try{
  // Ledger owns its own data hydration. A failure in another tab/data feed
  // must never prevent the core card list from being displayed.
  try{
    if(!Array.isArray(cards)) cards=[];
    cards=cards.filter(c=>c&&typeof c==='object');
  }catch(_e){ cards=[]; }
  // Never allow a stale/empty data source to make the Ledger disappear.
  // DEFAULT_CARDS is the emergency display source; saved records are preferred.
  const safeRemoved = removedCardNames instanceof Set ? removedCardNames : new Set();
  if(!Array.isArray(cards) || !cards.length){
    cards=DEFAULT_CARDS.map(name=>({id:uid(),name,limit:Number((DEFAULTS[name]||{}).limit)||0,billingDate:(DEFAULTS[name]||{}).billingDate||'',limitGroup:(DEFAULTS[name]||{}).limitGroup||null,isDebit:false,entries:[],fee:null}));
  }
  DEFAULT_CARDS.forEach(name=>{
    if(!safeRemoved.has(name) && !cards.some(c=>c&&c.name===name)){
      const d=DEFAULTS[name]||{};
      cards.push({id:uid(),name,limit:Number(d.limit)||0,billingDate:d.billingDate||'',limitGroup:d.limitGroup||null,isDebit:false,entries:[],fee:null});
    }
  });
  const creditCards = cards.filter(c=>c&&!c.isDebit&&!c.feeOnly&&(!safeRemoved.has(c.name)||DEFAULT_CARDS.includes(c.name)));
  const debitCards = cards.filter(c=>c&&c.name===DEBIT_CARD_NAME&&!safeRemoved.has(c.name));

  const seenGroups = new Set();
  let totalLimit = 0;
  creditCards.forEach(c=>{
    if(c.limitGroup){ if(seenGroups.has(c.limitGroup)) return; seenGroups.add(c.limitGroup); }
    totalLimit += Number(c.limit)||0;
  });
  const totalUsed = creditCards.reduce((sum,c)=>sum + Math.max(0,utilised(c)),0);
  const pct = totalLimit > 0 ? Math.round((totalUsed/totalLimit)*100) : 0;
  const over = pct >= 90;

  let html = `<div class="cover">
    <div class="cover-figures">
      <div class="cover-line"><span class="cover-label">Total utilised</span><span class="cover-amt total">${inr(totalUsed)}</span></div>
      <div class="cover-line"><span class="cover-label">Combined limit</span><span class="cover-amt">${inr(totalLimit)}</span></div>
      <div class="cover-line"><span class="cover-label">Headroom left</span><span class="cover-amt">${inr(Math.max(0,totalLimit-totalUsed))}</span></div>
    </div>
    <div class="stamp ${over?'over':''}"><span class="pct">${pct}%</span><span class="cap">of limit used</span></div>
  </div>`;

  html += `<div class="toolbar">
    <input type="text" id="search" placeholder="Find a card…" value="${String(filterText||'').replace(/"/g,'&quot;')}" oninput="onSearch(this.value)">
    <button class="sort-btn ${sortByUtil?'active':''}" onclick="toggleSort()">${sortByUtil ? '⇅ Sorted by usage' : '⇅ Sort by usage'}</button>
  </div>`;

  let list = creditCards.filter(c=>c.name.toLowerCase().includes(String(filterText||'').toLowerCase()));
  if(sortByUtil){
    list=[...list].sort((a,b)=>{
      const pa=(Number(a.limit)||0)>0?utilised(a)/Number(a.limit):-1;
      const pb=(Number(b.limit)||0)>0?utilised(b)/Number(b.limit):-1;
      return pb-pa;
    });
  }

  html += '<div class="ledger">';
  if(!list.length) html += '<div class="no-match">No card matches that search.</div>';
  list.forEach(card=>{ html += renderRow(card); });
  html += '</div>';

  if(!filterText){
    html += `<div class="section-label">Tracked for analysis only</div><div class="ledger">${debitCards.map(c=>renderRow(c)).join('')}</div>`;
  }

  html += addCardFormHTML('ledger');

  app.innerHTML=html;
  }catch(error){
    console.error('Ledger render failed:',error);
    const safe=Array.isArray(cards)?cards.filter(c=>c&&typeof c==='object'):[];
    app.innerHTML='<div class="panel"><h2>Card Ledger</h2><div class="sub">Ledger loaded in safe mode. '+safe.length+' card records found.</div><div class="ledger">'+safe.map(c=>'<div class="row"><div class="row-main"><div><div class="row-name">'+String(c.name||'Unnamed card')+'</div><div class="row-sub">'+(c.billingDate?'Bill date · '+String(c.billingDate):'Bill date not set')+'</div></div><div class="row-amts"><div class="row-used">₹'+Math.round(Math.max(0,utilised(c)||0)).toLocaleString('en-IN')+'</div><div class="row-limit">'+(c.limit?'of ₹'+Math.round(c.limit).toLocaleString('en-IN'):'limit not set')+'</div></div></div></div>').join('')+'</div><div class="sub" style="margin-top:10px">Technical error: '+String(error&&error.message||error)+'</div></div>';
  }
}

function renderRow(card){
  const used=utilised(card);
  const limit=Number(card.limit)||0;
  const cardPct=(!card.isDebit && limit>0)?Math.min(100,Math.max(0,(used/limit)*100)):0;
  const barClass=cardPct>=90?'over':cardPct>=70?'warn':'';
  const isOpen=openId===card.id;
  return `<div class="row ${card.isDebit?'debit-row':''}" data-id="${card.id}">
    <div class="row-main" onclick="toggleCard('${card.id}')">
      <div>
        <div class="row-name">${card.name}${card.limitGroup?'<span class="share-tag">shared limit</span>':''}</div>
        <div class="row-sub">${card.isDebit?'Not counted in credit utilisation':(card.billingDate?'Bill date · '+card.billingDate:'Bill date not set')}</div>
      </div>
      <div class="row-amts">
        <div class="row-used">${inr(Math.max(0,used))}<span class="chevron ${isOpen?'open':''}">▼</span></div>
        <div class="row-limit">${card.isDebit?'lifetime logged':'of '+(limit>0?inr(limit):'limit not set')}</div>
      </div>
      ${card.isDebit?'':`<div class="bar-track"><div class="bar-fill ${barClass}" style="width:${cardPct}%"></div></div>`}
    </div>
    <div class="detail-wrap ${isOpen?'open':''}">
      <div class="detail-inner"><div class="detail">${renderDetail(card)}</div></div>
    </div>
  </div>`;
}

function renderDetail(card){
  const entries=[...(card.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
  let rows=entries.map(e=>{
    const isEditing=editingEntry && editingEntry.cardId===card.id && editingEntry.entryId===e.id;
    if(isEditing){
      return `<tr class="editing-entry">
        <td><input type="date" id="edit-date-${card.id}-${e.id}" value="${e.date}"></td>
        <td><select id="edit-type-${card.id}-${e.id}" onchange="toggleEditEntryFields('${card.id}','${e.id}')"><option value="txn" ${e.type==='txn'?'selected':''}>Spend</option>${card.isDebit?'':`<option value="repay" ${e.type==='repay'?'selected':''}>Repayment</option>`}</select></td>
        <td><input type="number" id="edit-amt-${card.id}-${e.id}" value="${e.amount}" min="0" step="0.01"></td>
        <td><input list="cat-list" id="edit-cat-${card.id}-${e.id}" value="${e.category||''}" placeholder="Category"><input type="text" id="edit-plat-${card.id}-${e.id}" value="${e.platform||''}" placeholder="Platform"></td>
        <td><input type="text" id="edit-note-${card.id}-${e.id}" value="${e.note||''}" placeholder="Note"></td>
        <td><button class="edit-btn" onclick="saveEditedEntry('${card.id}','${e.id}',event)">save</button><button class="del" onclick="cancelEditEntry(event)">cancel</button></td>
      </tr>`;
    }
    return `<tr class="${e._fresh?'fresh':''}">
      <td>${e.date}</td><td><span class="tag ${e.type}">${e.type==='txn'?'Spend':'Repaid'}</span></td>
      <td class="${e.type==='txn'?'amt-txn':'amt-repay'}">${e.type==='txn'?'+':'−'}${inr(e.amount)}</td>
      <td>${e.type==='txn'&&e.category?`<span class="cat-chip">${e.category}</span>`:''}${e.platform?` <span class="plat-chip">${e.platform}</span>`:''}</td>
      <td>${e.note||''}</td>
      <td><button class="edit-btn" onclick="startEditEntry('${card.id}','${e.id}',event)">edit</button><button class="del" onclick="deleteEntry('${card.id}','${e.id}',event)">remove</button></td>
    </tr>`;
  }).join('');

  const limitFields=card.isDebit?'':`<div class="detail-grid">
    <div class="field"><label>Credit limit (₹)</label><input type="number" value="${card.limit||''}" placeholder="e.g. 50000" onchange="updateLimit('${card.id}',this.value)">${card.limitGroup?'<div class="share-note">Shared limit — editing this updates both cards.</div>':''}</div>
    <div class="field"><label>Billing date</label><input type="text" value="${card.billingDate||''}" placeholder="e.g. 5th of month" onchange="updateBillingDate('${card.id}',this.value)"></div>
  </div>`;

  const cardEditActions = `<div class="chat-actions" style="margin-bottom:10px;">
    <button class="tab-btn" onclick="editCardDetails('${card.id}')">Edit card details</button>
    <button class="tab-btn" onclick="removeCardUI('${card.id}',event)">Remove card</button>
  </div>`;
  return `${editingCardId===card.id ? cardEditorHTML(card,'ledger') : cardEditActions}
    ${limitFields}
    <div class="entry-form">
      <select id="type-${card.id}" onchange="toggleEntryFields('${card.id}')"><option value="txn">Spend</option>${card.isDebit?'':'<option value="repay">Repayment</option>'}</select>
      <input type="date" id="date-${card.id}" value="${todayStr()}"><input type="number" id="amt-${card.id}" placeholder="Amount ₹">
      <input list="cat-list" id="cat-${card.id}" placeholder="Category"><input type="text" id="plat-${card.id}" placeholder="Platform (optional)"><input type="text" id="note-${card.id}" placeholder="Note (optional)">
      <button onclick="addEntry('${card.id}',event)">Log</button>
    </div>
    ${entries.length?`<div class="table-scroll"><table class="statement"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Category / Platform</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty-stmt">No entries logged yet for this card.</div>'}`;
}

  const catEl=document.getElementById('cat-'+id), platEl=document.getElementById('plat-'+id);
  const disabled=type==='repay';

  if(platEl){platEl.disabled=disabled;platEl.style.opacity=disabled?.4:1;}
}
function toggleCard(id){openId=(openId===id)?null:id;render();}
function onSearch(v){filterText=v;render();const el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(v.length,v.length);}}
function toggleSort(){sortByUtil=!sortByUtil;render();}
function findCard(id){return cards.find(c=>c.id===id);}

async function updateLimit(id,val){
  const c=findCard(id); if(!c)return;
  const newLimit=Number(val)||0;
  if(c.limitGroup) cards.forEach(x=>{if(x.limitGroup===c.limitGroup)x.limit=newLimit;}); else c.limit=newLimit;
  await saveData(); render(); showToast('Limit updated');

async function updateBillingDate(id,val){

async function addEntry(id,evt){
  if(evt)evt.stopPropagation();
  const type=document.getElementById('type-'+id).value;

  const amtInput=document.getElementById('amt-'+id);

async function deleteEntry(cardId,entryId,evt){
  if(evt)evt.stopPropagation();
  const c=findCard(cardId); if(!c)return;
  c.entries=c.entries.filter(e=>e.id!==entryId); await saveData(); render(); showToast('Entry removed');
}
function startEditEntry(cardId,entryId,evt){if(evt)evt.stopPropagation();editingEntry={cardId,entryId};render();}
function cancelEditEntry(evt){if(evt)evt.stopPropagation();editingEntry=null;render();}
async function saveEditedEntry(cardId,entryId,evt){
  if(evt)evt.stopPropagation();
  const c=findCard(cardId); if(!c)return;
  const e=c.entries.find(x=>x.id===entryId); if(!e)return;
  e.date=document.getElementById('edit-date-'+cardId+'-'+entryId).value||e.date;
  e.type=document.getElementById('edit-type-'+cardId+'-'+entryId).value;
  e.amount=Number(document.getElementById('edit-amt-'+cardId+'-'+entryId).value)||0;
  e.category=document.getElementById('edit-cat-'+cardId+'-'+entryId).value.trim();
  e.platform=document.getElementById('edit-plat-'+cardId+'-'+entryId).value.trim();
  e.note=document.getElementById('edit-note-'+cardId+'-'+entryId).value.trim();
  e._fresh=false;
  editingEntry=null; await saveData(); render(); showToast('Entry updated');
}
function collectSpends(){
  const rows = [];
  cards.forEach(card => {
    card.entries.forEach(e => {
      if(e.type !== 'txn') return;
      rows.push({
        card: card.name,
        isDebit: !!card.isDebit,
        category: e.category && e.category.trim() ? e.category.trim() : 'Uncategorised',
        platform: e.platform && e.platform.trim() ? e.platform.trim() : '',
        amount: e.amount,
        date: e.date
      });
    });
  });

  // Card annual fees / insurance premiums — logged under the debit bucket,
  // since none of these are card spends earning rewards.
  cards.forEach(card => {
    if(card.name === DEBIT_CARD_NAME) return;
    if(!feeApplicable(card.fee)) return;
    card.fee.payments.forEach(p => {
      rows.push({
        card: DEBIT_CARD_NAME, isDebit: true,
        category: card.isInsurance ? 'Insurance' : 'Card Fees',
        platform: card.name,
        amount: p.amount, date: p.date
      });
    });
  });

  // Term Insurance — automatic monthly occurrences for this calendar year,
  // one per month whose due date has already passed.
  const now = new Date();
  for(let m=0; m<=now.getMonth(); m++){
    const day = Math.min(TERM_INSURANCE.day, daysInMonth(now.getFullYear(), m));
    const d = new Date(now.getFullYear(), m, day);
    if(d > now) continue;
    rows.push({
      card: DEBIT_CARD_NAME, isDebit: true, category: 'Insurance', platform: 'Term Insurance',
      amount: TERM_INSURANCE.amount, date: d.toISOString().slice(0,10)
    });
  }

  return rows;
}

function periodParts(dateStr){ const d = new Date(dateStr+'T00:00:00'); return { y: d.getFullYear(), m: d.getMonth() }; }

function sumWhere(rows, fn){ return rows.reduce((s,r)=> fn(r) ? s + r.amount : s, 0); }

function pctDelta(curr, prev){
  if(prev === 0 && curr === 0) return {label:'—', cls:'flat'};
  if(prev === 0) return {label:'new', cls:'up'};
  const d = Math.round(((curr-prev)/prev)*100);
  if(d === 0) return {label:'0%', cls:'flat'};
  return { label:(d>0?'+':'')+d+'%', cls: d>0 ? 'up' : 'down' };
}

function deltaBadge(curr, prev){ const d = pctDelta(curr, prev); return `<span class="delta ${d.cls}">${d.label}</span>`; }


function renderAnalysis(){
  const app = document.getElementById('app');
  const rows = collectSpends();
  if(!rows.length){
    app.innerHTML = `<div class="panel"><div class="empty-analysis">No spends logged yet. Log a few transactions with a category (and platform, where relevant) on the Ledger tab, and the breakdowns will show up here.</div></div>`;
    return;
  }

  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const prevM = curM===0 ? 11 : curM-1;
  const prevMY = curM===0 ? curY-1 : curY;
  const prevY = curY-1;

  function figs(filterExtra){
    const curMonth = sumWhere(rows, r => filterExtra(r) && periodParts(r.date).y===curY && periodParts(r.date).m===curM);
    const prMonth  = sumWhere(rows, r => filterExtra(r) && periodParts(r.date).y===prevMY && periodParts(r.date).m===prevM);
    const curYear  = sumWhere(rows, r => filterExtra(r) && periodParts(r.date).y===curY);
    const prYear   = sumWhere(rows, r => filterExtra(r) && periodParts(r.date).y===prevY);
    return {curMonth, prMonth, curYear, prYear};
  }

  // ---- Category table (with platform sub-rows) ----
  const categories = [...new Set(rows.map(r=>r.category))].sort((a,b)=> {
    const ta = sumWhere(rows, r=>r.category===a), tb = sumWhere(rows, r=>r.category===b);
    return tb - ta;
  });

  let catRows = '';
  categories.forEach(cat => {
    const f = figs(r => r.category===cat);
    catRows += `<tr class="group-row">
      <td>${cat}</td>
      <td>${inr(f.curMonth)} ${deltaBadge(f.curMonth,f.prMonth)}</td>
      <td>${inr(f.prMonth)}</td>
      <td>${inr(f.curYear)} ${deltaBadge(f.curYear,f.prYear)}</td>
      <td>${inr(f.prYear)}</td>
    </tr>`;
    const platforms = [...new Set(rows.filter(r=>r.category===cat && r.platform).map(r=>r.platform))]
      .sort((a,b)=> sumWhere(rows, r=>r.category===cat && r.platform===b) - sumWhere(rows, r=>r.category===cat && r.platform===a));
    platforms.forEach(p => {
      const pf = figs(r => r.category===cat && r.platform===p);
      catRows += `<tr class="sub-row">
        <td>${p}</td>
        <td>${inr(pf.curMonth)} ${deltaBadge(pf.curMonth,pf.prMonth)}</td>
        <td>${inr(pf.prMonth)}</td>
        <td>${inr(pf.curYear)} ${deltaBadge(pf.curYear,pf.prYear)}</td>
        <td>${inr(pf.prYear)}</td>
      </tr>`;
    });
  });

  // ---- Card table ----
  const cardNames = [...new Set(rows.map(r=>r.card))].sort((a,b)=> sumWhere(rows,r=>r.card===b) - sumWhere(rows,r=>r.card===a));
  let cardRows = '';
  cardNames.forEach(cn => {
    const f = figs(r => r.card===cn);
    cardRows += `<tr class="group-row">
      <td>${cn}</td>
      <td>${inr(f.curMonth)} ${deltaBadge(f.curMonth,f.prMonth)}</td>
      <td>${inr(f.prMonth)}</td>
      <td>${inr(f.curYear)} ${deltaBadge(f.curYear,f.prYear)}</td>
      <td>${inr(f.prYear)}</td>
    </tr>`;

    // Category share of this card's all-time logged spend.
    const cardTotal = sumWhere(rows, r => r.card===cn);
    const cardCatTotals = {};
    rows.filter(r=>r.card===cn).forEach(r => cardCatTotals[r.category] = (cardCatTotals[r.category]||0) + r.amount);
    const cardCats = Object.entries(cardCatTotals).sort((a,b)=>b[1]-a[1]);
    cardCats.forEach(([cat, amt]) => {
      const share = cardTotal>0 ? Math.round(amt/cardTotal*100) : 0;
      cardRows += `<tr class="sub-row">
        <td>${cat}</td>
        <td colspan="4">
          <span class="cat-share-bar"><span class="cat-share-fill" style="width:${share}%"></span></span>
          ${inr(amt)} <span class="cat-share-pct">${share}%</span>
        </td>
      </tr>`;
    });
  });

  const monthName = now.toLocaleDateString('en-IN', {month:'long'});
  const prevMonthName = new Date(prevMY, prevM, 1).toLocaleDateString('en-IN', {month:'long'});

  let html = '';
  html += `<div class="panel">

function buildInsights(rows, p){
  const insights = [];
  const thisMonth = r => periodParts(r.date).y===p.curY && periodParts(r.date).m===p.curM;
  const lastMonth = r => periodParts(r.date).y===p.prevMY && periodParts(r.date).m===p.prevM;
  const thisYear  = r => periodParts(r.date).y===p.curY;
  const lastYear  = r => periodParts(r.date).y===p.prevY;

  const monthRows = rows.filter(thisMonth);
  const monthTotal = monthRows.reduce((s,r)=>s+r.amount,0);
  const lastMonthTotal = rows.filter(lastMonth).reduce((s,r)=>s+r.amount,0);

  const byCat = {};
  monthRows.forEach(r => byCat[r.category] = (byCat[r.category]||0)+r.amount);

  if(monthTotal>0){
    const topCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
    if(topCat){
      insights.push(`Your biggest spend category this month is <b>${topCat[0]}</b> at ${inr(topCat[1])}, ${Math.round(topCat[1]/monthTotal*100)}% of everything logged this month.`);
    }
    const d = pctDelta(monthTotal, lastMonthTotal);
    if(d.label !== '—' && d.label !== 'new'){
      insights.push(`Total logged spend is <b>${d.label}</b> vs last month (${inr(lastMonthTotal)} → ${inr(monthTotal)}).`);
    }
  }

  // Category with the sharpest year-over-year rise (needs data in both years)
  const catThisYear = {}, catLastYear = {};
  rows.filter(thisYear).forEach(r => catThisYear[r.category]=(catThisYear[r.category]||0)+r.amount);
  rows.filter(lastYear).forEach(r => catLastYear[r.category]=(catLastYear[r.category]||0)+r.amount);
  let bestRise = null;
  Object.keys(catThisYear).forEach(cat => {
    const prev = catLastYear[cat]||0;
    if(prev <= 0) return;
    const rise = (catThisYear[cat]-prev)/prev;
    if(rise > 0 && (!bestRise || rise > bestRise.rise)) bestRise = {cat, rise, curr:catThisYear[cat], prev};
  });
  if(bestRise){
    insights.push(`<b>${bestRise.cat}</b> spend has grown the most year-on-year — up ${Math.round(bestRise.rise*100)}% from ${inr(bestRise.prev)} (Jan–Dec ${p.prevY}) to ${inr(bestRise.curr)} so far this year.`);
  } else if(Object.keys(catLastYear).length===0){
    insights.push(`Once you've logged a full year of spends, this tab will start comparing year-on-year trends per category.`);
  }

  // Card concentration this month
  const byCard = {};
  monthRows.forEach(r => byCard[r.card] = (byCard[r.card]||0)+r.amount);
  const topCard = Object.entries(byCard).sort((a,b)=>b[1]-a[1])[0];
  if(topCard && monthTotal>0 && topCard[1]/monthTotal > 0.4){
    insights.push(`<b>${topCard[0]}</b> is carrying ${Math.round(topCard[1]/monthTotal*100)}% of this month's logged spend — worth double-checking it's tracking toward its billing date comfortably.`);
  }

  // Debit vs credit share
  const debitMonth = monthRows.filter(r=>r.isDebit).reduce((s,r)=>s+r.amount,0);
  const creditMonth = monthTotal - debitMonth;
  if(debitMonth > 0 && monthTotal > 0){
    const sharePct = Math.round(debitMonth/monthTotal*100);
    if(sharePct >= 20){
      insights.push(`${inr(debitMonth)} (${sharePct}%) of this month's spend went through debit/other rails rather than a credit card — routing recurring, eligible spends through a credit card instead is usually the cheaper way to also earn rewards, as long as it's paid off in full each cycle.`);
    }
  }

  // Category-level payment-method suggestion for the top debit category
  const debitByCat = {};
  monthRows.filter(r=>r.isDebit).forEach(r => debitByCat[r.category] = (debitByCat[r.category]||0)+r.amount);
  const topDebitCat = Object.entries(debitByCat).sort((a,b)=>b[1]-a[1])[0];
  if(topDebitCat && topDebitCat[1] > 0){
    insights.push(`Most of your debit spend this month was on <b>${topDebitCat[0]}</b> (${inr(topDebitCat[1])}). If one of your cards has a bonus category or offer there, routing it through that card instead could be worth checking.`);
  }

  // Platform concentration in top category
  const platCounts = {};
  monthRows.filter(r=>r.category === (Object.entries(byCat)[0]||[])[0] && r.platform).forEach(r => platCounts[r.platform]=(platCounts[r.platform]||0)+r.amount);
  const topPlat = Object.entries(platCounts).sort((a,b)=>b[1]-a[1])[0];
  if(topPlat){
    insights.push(`Within your top category, <b>${topPlat[0]}</b> is where most of the money is going — worth checking if any of your cards have a live offer or accelerated rewards specifically for that platform.`);
  }

  if(insights.length===0){
    insights.push(`Log a few more spends with categories to start seeing patterns here.`);
  }
  return insights;
}

async function renderCoreTabData(tab){
  // IMPORTANT: do not reload STORAGE_KEY when switching tabs. The in-memory
  // global `cards` array is the authoritative session dataset already loaded
  // during init(). Reloading it here could replace the live transaction records
  // with an older/partial local snapshot and make Ledger/Accounts appear empty
  // while Analysis/Rewards still show the data.
  try{
    if(tab==='dues') await loadDues();
    if(!Array.isArray(cards)) cards=[];
    cards.forEach(c=>{
      if(!c || typeof c!=='object') return;
      if(!Array.isArray(c.entries)) c.entries=[];
      if(c.fee && typeof c.fee!=='object') c.fee=null;
    });
    window.__coreTabSessionDiagnostics={
      tab,
      cards:cards.length,
      cardsWithEntries:cards.filter(c=>Array.isArray(c.entries)&&c.entries.length>0).length,
      totalEntries:cards.reduce((n,c)=>n+(Array.isArray(c.entries)?c.entries.length:0),0),
      dueBills:Array.isArray(dueBills)?dueBills.length:0
    };
  }catch(e){
    console.error('Card Ledger core tab preparation error',e);
  }
}

    if(activeTab==='recurring') return renderRecurring();

  }

async function loadLedgerSource(){
  // CORE HYDRATION: local saved records contain private entries/fees; the
  // GitHub master contains authoritative card metadata. Merge them by card
  // name, preserve all local history, then persist the merged card records so
  // every tab sees exactly the same card objects on the next render.
  await loadData();

  try{
    const res=await fetch('./card-master.json?ts='+Date.now(),{cache:'no-store'});
    if(res.ok){
      const master=await res.json();
      if(master && Array.isArray(master.cards) && master.cards.length) GITHUB_CARD_MASTER=master.cards;
    }
  }catch(e){ console.warn('Could not load card-master.json.',e); }

  const sourceCards=Array.isArray(GITHUB_CARD_MASTER)?GITHUB_CARD_MASTER:[];
  if(window.__localDataRecoveryRequired){ window.__cardMasterLoaded=false; return {recoveryRequired:true,reason:window.__localDataRecoveryReason||'Local data unavailable'}; }
  const validSource=sourceCards.filter(c=>c&&typeof c==='object'&&c.name);
  const existing=(Array.isArray(cards)?cards:[]).filter(c=>c&&typeof c==='object');
  const byName=new Map(existing.map(c=>[String(c.name||'').trim().toLowerCase(),c]));

  const merged=validSource.map((src,i)=>{
    const key=String(src.name).trim().toLowerCase();
    const old=byName.get(key)||{};
    const d=DEFAULTS[src.name]||{};
    const info=ACCOUNT_INFO[src.name]||{};
    return {
      ...src,
      ...old,
      id:String(old.id||src.id||('github-card-'+i)),
      name:String(src.name),
      limit:Number(old.limit)||Number(src.limit)||0,
      billingDate:String(old.billingDate||src.billingDate||d.billingDate||''),
      limitGroup:old.limitGroup||src.limitGroup||d.limitGroup||null,
      isDebit:old.isDebit!=null?!!old.isDebit:!!src.isDebit,
      feeOnly:old.feeOnly!=null?!!old.feeOnly:!!src.feeOnly,
      isInsurance:old.isInsurance!=null?!!old.isInsurance:!!src.isInsurance,
      network:String(old.network!=null?old.network:(src.network!=null?src.network:(info.network||''))),
      tier:String(old.tier!=null?old.tier:(src.tier!=null?src.tier:(info.tier||''))),
      bin:String(old.bin!=null?old.bin:(src.bin!=null?src.bin:(info.bin||''))),
      openedMonth:Number(old.openedMonth||src.openedMonth||info.openedMonth)||0,
      openedYear:Number(old.openedYear||src.openedYear||info.openedYear)||0,
      entries:Array.isArray(old.entries)?old.entries:[],
      fee:old.fee&&typeof old.fee==='object'?old.fee:blankFeeForCard(src.name)
    };
  });

  // Keep locally-created cards that are not yet in the GitHub master.
  existing.forEach(old=>{
    if(!old||typeof old!=='object') return;
    const key=String(old.name||'').trim().toLowerCase();
    if(!merged.some(c=>String(c.name||'').trim().toLowerCase()===key)) merged.push(old);
  });
  cards=merged;

  // Re-link saved statements to the current card IDs after the metadata merge.
  try{
    const cardByName=new Map((Array.isArray(cards)?cards:[]).filter(c=>c&&typeof c==='object').map(c=>[String(c.name||'').trim().toLowerCase(),c]));
    if(Array.isArray(dueBills)) dueBills.forEach(b=>{
      const card=cardByName.get(String(b.cardName||'').trim().toLowerCase());
      if(card)b.cardId=card.id;
    });
  }catch(e){}

  // Persist the merged metadata + preserved private data. This is important:
  // without this write, the next tab could reload an older local card object.
  await saveData();

  window.__cardMasterSource='github';
  window.__cardMasterLoaded=validSource.length>0;
  window.__cardMasterVersion='v132';
  window.__coreDataDiagnostics={
    sourceCards:validSource.length,
    mergedCards:cards.length,
    cardsWithEntries:cards.filter(c=>Array.isArray(c.entries)&&c.entries.length>0).length,
    totalEntries:cards.reduce((n,c)=>n+(Array.isArray(c.entries)?c.entries.length:0),0),
    dueBills:Array.isArray(dueBills)?dueBills.length:0,
    cardsWithOpeningDates:cards.filter(c=>c.openedMonth&&c.openedYear).length,
    cardsWithBillingDates:cards.filter(c=>parseDay(c.billingDate)).length
  };
  return {cardCount:cards.length,source:'github',preservedExistingData:true};
}

/* One-time PWA notification test: IDFC Power+ and SBI SimplyClick at the next 01:44 local time. */
function schedulePowerPlusTestNotification(){
  const target=new Date();
  target.setHours(1,44,0,0);
  if(target.getTime()<=Date.now()) target.setDate(target.getDate()+1);
  const y=target.getFullYear(), m=String(target.getMonth()+1).padStart(2,'0'), d=String(target.getDate()).padStart(2,'0');
  const key='power-plus-simplyclick-test-notification-'+y+m+d+'-0144';
  if(localStorage.getItem(key)==='1') return;
  const fire=async()=>{
    if(localStorage.getItem(key)==='1') return;
    if(!notificationSupported()||Notification.permission!=='granted') return;
    const names=['IDFC Power+','SBI SimplyClick'];
    const selected=names.map(name=>cards.find(c=>c.name===name)).filter(Boolean);
    const lines=selected.map(card=>card.name+' — '+inr(Math.max(0,Number(utilised(card))||0)));
    const title='Card Ledger — Sample statement alerts';
    const total=selected.reduce((sum,card)=>sum+Math.max(0,Number(utilised(card))||0),0);
    const options={body:lines.join(' · ')+' · Total — '+inr(total),icon:'./icon-192.svg',badge:'./icon-192.svg',tag:'power-plus-simplyclick-test-'+y+m+d+'-0144',renotify:true,data:{url:'./',cardIds:selected.map(c=>c.id),date:y+'-'+m+'-'+d}};
    try{
      const reg=await navigator.serviceWorker.ready;
      if(reg.active){
        reg.active.postMessage({type:'SHOW_STATEMENT_NOTIFICATION',title,options});
        localStorage.setItem(key,'1');
        showToast('Sample notification sent');
        return;
      }
    }catch(e){}
    try{
      if(Notification.permission==='granted'){
        new Notification(title,options);
        localStorage.setItem(key,'1');
        showToast('Sample notification sent');
      }
    }catch(e){}
  };
  const delay=target.getTime()-Date.now();
  if(delay>0) setTimeout(fire,delay); else setTimeout(fire,300);
}
