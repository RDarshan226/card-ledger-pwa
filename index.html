let openFeeId = null;

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function parseDay(str){ if(!str) return null; const m = String(str).match(/(\d+)/); return m ? parseInt(m[1],10) : null; }
function nextMonthlyDue(day){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const clampedThis = Math.min(day, daysInMonth(y,m));
  if(clampedThis >= now.getDate()) return new Date(y,m,clampedThis).toISOString().slice(0,10);
  const nm = m===11?0:m+1, ny = m===11?y+1:y;
  const clampedNext = Math.min(day, daysInMonth(ny,nm));
  return new Date(ny,nm,clampedNext).toISOString().slice(0,10);
}

function toggleFeeCard(id){ openFeeId = (openFeeId===id) ? null : id; render(); }

async function repairFeeData(){
  try{
    if(!Array.isArray(cards)) cards=[];
    cards.forEach(c=>{
      const old=(c.fee && typeof c.fee==='object') ? c.fee : {};
      const fresh=blankFeeForCard(c.name);
      c.fee=Object.assign(fresh,old);
      if(!Array.isArray(c.fee.payments)) c.fee.payments=[];
      if(!Array.isArray(c.fee.rewardRules)) c.fee.rewardRules=[];
      if(!Array.isArray(c.fee.surchargeRules)) c.fee.surchargeRules=[];
      c.fee.payments=c.fee.payments.filter(Boolean).map(p=>({id:p.id||uid(),date:String(p.date||''),amount:Number(p.amount)||0}));
    });
    saveData().then(()=>{openFeeId=null;render();showToast('Card fee data repaired');}).catch(e=>{console.error(e);render();showToast('Fee data repaired locally');});
  }catch(e){console.error('Fee repair error',e);render();showToast('Could not repair fee data');}
}

function renderFees(){
  const app=document.getElementById('app');
  if(!app) return;
  if(!Array.isArray(cards)) cards=[];

  // Card Fees is deliberately self-contained: it must render even when an
  // older saved card has incomplete fee data. Every non-debit card is shown,
  // and cards without a fee can be tracked directly from this screen.
  const visible=cards.filter(c=>c && c.name!==DEBIT_CARD_NAME && c.name!=="IDFC Millenia" && feeApplicable(c.fee));
  const today=todayStr();

  let html='<div class="panel"><h2>Card Fees</h2><div class="sub">Track annual fees, waiver conditions, payment history and break-even spend. Tap a card to expand it.</div>';
  if(!visible.length){
    html+='<div class="empty-analysis">No credit cards found.</div>';
  }else{
    html+='<div class="ledger">';
    visible.forEach(c=>{
      const fee=(c.fee && typeof c.fee==='object')?c.fee:{};
      const payments=Array.isArray(fee.payments)?fee.payments:[];
      const base=Number(fee.baseAmount)||0;
      const gst=fee.gstPct!=null?Number(fee.gstPct)||0:Number(GST_PCT)||0;
      const total=Math.round(base*(1+gst/100));
      const due=fee.nextDueOverride || feeNextDueFrom(payments) || today;
      const waived=feeIsWaived(c);
      const applicable=feeApplicable(fee);
      const open=openFeeId===c.id;
      const last=payments.length?[...payments].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]:null;
      let status='No fee tracked';
      if(waived) status='Waived';
      else if(applicable && due<=today) status=due===today?'Due today':'Overdue';
      else if(applicable) status=due;
      html+=`<div class="row">
        <div class="row-main" onclick="toggleFeeCard('${c.id}')">
          <div>
            <div class="row-name">${c.name}<span class="share-tag fee-type-tag">${c.isInsurance?'Insurance':'Credit'}</span></div>
            <div class="row-sub">${last?'Last paid '+last.date+' · '+inr(Number(last.amount)||0):(applicable?'Fee tracked · no payment logged':'No fee tracked yet')}</div>
          </div>
          <div class="row-amts">
            <div class="row-used">${waived?inr(0):inr(total)}<span class="chevron ${open?'open':''}">▼</span></div>
            <div class="row-limit">${status}</div>
          </div>
        </div>
        <div class="detail-wrap ${open?'open':''}"><div class="detail-inner"><div class="detail">${renderFeeDetailSafe(c,fee,total,waived,applicable)}</div></div></div>
      </div>`;
    });
    html+='</div>';
  }
  html+='</div>';
  app.innerHTML=html;
}

function renderFeeDetailSafe(card,fee,total,waived,applicable){
  const payments=Array.isArray(fee.payments)?fee.payments:[];
  const reward=Number(fee.rewardRatePct)||0;
  const required=reward>0?Math.round(total/(reward/100)):0;
  let html='<div class="detail-grid">';
  html+=`<div class="field"><label>Base annual fee</label><input type="number" value="${Number(fee.baseAmount)||0}" onchange="updateFeeField('${card.id}','baseAmount',this.value)"></div>`;
  html+=`<div class="field"><label>GST %</label><input type="number" value="${fee.gstPct!=null?Number(fee.gstPct):Number(GST_PCT)||0}" onchange="updateFeeField('${card.id}','gstPct',this.value)"></div>`;
  html+=`<div class="field"><label>General reward rate %</label><input type="number" step="0.01" value="${reward}" onchange="updateFeeField('${card.id}','rewardRatePct',this.value)"></div>`;
  html+=`<div class="field"><label>Next due date</label><input type="date" value="${fee.nextDueOverride||''}" onchange="updateFeeField('${card.id}','nextDueOverride',this.value)"></div>`;
  html+='</div>';
  html+=`<div class="breakeven-box"><b>Total fee incl. GST: ${waived?inr(0):inr(total)}</b>${required?' · Break-even spend at '+reward+'%: '+inr(required):''}</div>`;
  if(payments.length){
    html+='<div class="section-label">Payment history</div><table class="statement"><thead><tr><th>Date</th><th>Amount</th></tr></thead><tbody>'+payments.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(p=>'<tr><td>'+p.date+'</td><td>'+inr(Number(p.amount)||0)+'</td></tr>').join('')+'</tbody></table>';

    <input type="date" id="fee-date-${card.id}" value="${todayStr()}">

  if(!applicable) html+=`<div style="margin-top:10px"><button class="fee-track-btn" onclick="trackFee('${card.id}')">Track this fee</button></div>`;
  return html;
}
function renderFeeDetail(card){
  const fee = card.fee || blankFeeForCard(card.name);
  const total = feeTotalFor(fee);
  const payments = [...fee.payments].sort((a,b)=> b.date.localeCompare(a.date));
  const waived = feeIsWaived(card);

  let waiverBox = '';
  if(fee.waiver && fee.waiver.type==='transactions'){
    const count = txnCountThisYear(card);
    const left = Math.max(0, fee.waiver.threshold - count);
    waiverBox = `<div class="breakeven-box">${fee.waiver.note}. You've logged <b>${count}</b> transaction${count===1?'':'s'} on this card so far this year${waived ? ' — <b>threshold met, fee is waived</b>.' : `, so <b>${left} more</b> would waive the fee.`}
      <div class="entry-form" style="grid-template-columns:1fr 1fr auto; margin-top:10px; margin-bottom:0;">
        <input type="date" id="wtxn-date-${card.id}" value="${todayStr()}">
        <input type="number" id="wtxn-amt-${card.id}" placeholder="Amount ₹ (optional)">
        <button onclick="addWaiverTxn('${card.id}', event)">Log transaction</button>
      </div>
    </div>`;
  }

  let redemptionFeeBox = '';
  if(fee.redemptionFeeAmount > 0){
    redemptionFeeBox = `<div class="breakeven-box">This card charges <b>${inr(fee.redemptionFeeAmount)} per redemption</b> when you redeem rewards/points — tell me when you redeem and I'll log it as a charge in Cashback &amp; Charges.</div>`;
  }

  let breakeven = '';
  if(!card.isInsurance){
    const requiredSpend = fee.rewardRatePct>0 ? Math.round(total / (fee.rewardRatePct/100)) : null;
    breakeven = `<div class="breakeven-box">`;
    if(requiredSpend){
      breakeven += `At an assumed <b>${fee.rewardRatePct}%</b> reward rate, you'd need to spend about <b>${inr(requiredSpend)}</b> on this card to earn back the ${inr(total)} fee. `;
      if(fee.bestCategory && fee.bestCategory.trim()){
        breakeven += `<b>${fee.bestCategory.trim()}</b> is set as this card's best-return category — route spend there to hit break-even fastest.`;
      } else {
        const spendRows = collectSpends().filter(r => r.card === card.name);
        const byCat = {};
        spendRows.forEach(r => byCat[r.category] = (byCat[r.category]||0)+r.amount);
        const topCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
        if(topCat){
          breakeven += `No best-return category set yet, so this is based on usage: your heaviest logged category on this card is <b>${topCat[0]}</b> (${inr(topCat[1])} so far).`;
        } else {
          breakeven += `Set this card's best-return category below, or log a few spends with categories, to see which gets you there fastest.`;
        }
      }
    } else {
      breakeven += `Set a reward rate below to calculate the spend needed to break even on this fee.`;
    }
    breakeven += `</div>`;
  }

  const payRows = payments.map(p => `
    <tr><td>${p.date}</td><td class="amt-txn">${inr(p.amount)}</td><td><button class="del" onclick="deleteFeePayment('${card.id}','${p.id}', event)">remove</button></td></tr>
  `).join('');

  return `
    ${editingCardId===card.id ? cardEditorHTML(card,'fees') : `<div class="chat-actions" style="margin-bottom:10px;"><button class="tab-btn" onclick="editCardDetails('${card.id}')">Edit card</button><button class="tab-btn" onclick="removeCardUI('${card.id}',event)">Remove card</button></div>`}
    <div class="fee-grid">
      <div class="field"><label>${card.isInsurance ? 'Premium (₹)' : 'Base fee (₹)'}</label><input type="number" value="${fee.baseAmount||''}" onchange="updateFeeField('${card.id}','baseAmount', this.value)"></div>
      <div class="field"><label>GST %</label><input type="number" value="${fee.gstPct}" onchange="updateFeeField('${card.id}','gstPct', this.value)"></div>
      ${card.isInsurance ? '' : `<div class="field"><label>${fee.rewardRateConfirmed ? 'Reward rate %' : 'Reward rate % (unconfirmed default)'}</label><input type="number" step="0.1" value="${fee.rewardRatePct}" onchange="updateFeeField('${card.id}','rewardRatePct', this.value); updateFeeField('${card.id}','rewardRateConfirmed', 1)"></div>`}
      <div class="field"><label>Next ${card.isInsurance?'premium':'fee'} due</label><input type="date" value="${feeNextDue(fee)}" onchange="updateFeeDue('${card.id}', this.value)"></div>
      ${card.isInsurance ? '' : `<div class="field"><label>Best-return category</label><input type="text" list="cat-list" value="${fee.bestCategory||''}" placeholder="e.g. Grocery" onchange="updateFeeText('${card.id}','bestCategory', this.value)"></div>`}
    </div>
    ${card.isInsurance ? '' : renderRewardRulesEditor(card)}
    ${waiverBox}
    ${redemptionFeeBox}
    ${breakeven}
    <div class="entry-form" style="grid-template-columns:1fr 1fr auto;">
      <input type="date" id="feedate-${card.id}" value="${todayStr()}">
      <input type="number" id="feeamt-${card.id}" placeholder="Amount paid ₹" value="${total}">
      <button onclick="addFeePayment('${card.id}', event)">Log payment</button>
    </div>
    ${payments.length ? `<table class="statement">
      <thead><tr><th>Date</th><th>Amount</th><th></th></tr></thead>
      <tbody>${payRows}</tbody>
    </table>` : '<div class="empty-stmt">No fee payments logged yet.</div>'}
  `;
}

async function addSurchargeRule(id, evt){
  evt.stopPropagation();

/* ---------------- Bills & Dues ---------------- */
function dueDateForMonth(year, month, day){
  const d = Math.min(Number(day)||1, daysInMonth(year,month));
  return new Date(year,month,d).toISOString().slice(0,10);
}
function dueStatus(b){
  if(b.paidAmount >= b.totalDue && b.totalDue > 0) return {cls:'paid',label:'Paid'};
  const today = todayStr();
  if(b.dueDate < today) return {cls:'overdue',label:'Overdue'};
  if(b.dueDate === today) return {cls:'today',label:'Due today'};
  const days = Math.ceil((new Date(b.dueDate+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
  return {cls:'soon',label:`In ${days}d`};
}
function normaliseBills(){
  dueBills = (dueBills||[]).map(b=>({
    id:b.id||uid(), cardId:b.cardId||'', cardName:b.cardName||'', statementDate:b.statementDate||'', dueDate:b.dueDate||'',
    totalDue:Number(b.totalDue)||0, minimumDue:Number(b.minimumDue)||0, paidAmount:Number(b.paidAmount)||0,
    paymentDate:b.paymentDate||'', note:b.note||'', payments:Array.isArray(b.payments)?b.payments:[], createdAt:b.createdAt||Date.now()
  }));
}
async function loadDues(){
  try{
    const local=await readLocalDataFile();
    if(local && Array.isArray(local.dueBills)){ dueBills=local.dueBills; normaliseBills(); return; }
  }catch(e){}
  try{
    if(window.storage && typeof window.storage.get === 'function'){
      const r=await window.storage.get(DUES_KEY,false);
      if(r&&r.value) dueBills=JSON.parse(r.value);
    }

}

function billFor(cardId, dueDate){ return dueBills.find(b=>b.cardId===cardId && b.dueDate===dueDate); }
function nextBillingDateFor(card){
  const day=parseDay(masterBillingDate(card)); if(!day) return null;
  const now=new Date(); let y=now.getFullYear(),m=now.getMonth();
  let candidate=new Date(y,m,Math.min(day,daysInMonth(y,m)));
  if(candidate<new Date(now.getFullYear(),now.getMonth(),now.getDate())){m++;if(m>11){m=0;y++;}candidate=new Date(y,m,Math.min(day,daysInMonth(y,m)));}
  return candidate.toISOString().slice(0,10);
}

function monthStripHTML(dueMonths, amount){
  const now = new Date();
  const curM = now.getMonth();
  let html = '<div class="month-strip">';
  for(let m=0; m<12; m++){
    const isDue = dueMonths.includes(m);
    let cls = '';
    if(isDue){
      if(m < curM) cls = 'passed';
      else if(m === curM) cls = 'today';
      else cls = 'due';
    }
    html += `<div class="month-cell ${cls}"><span class="m-label">${MONTH_ABBR[m]}</span>${isDue ? inr(amount).replace('₹','') : '—'}</div>`;
  }
  html += '</div>';
  return html;
}

// Card fee payments already logged in Card Fees, folded into Cashback &
// Charges automatically as charges — no need to re-log them by hand.
function autoFeeCharges(){
  const rows = [];
  cards.forEach(card => {
    if(card.name === DEBIT_CARD_NAME) return;
    if(!feeApplicable(card.fee)) return;
    card.fee.payments.forEach(p => {
      rows.push({
        id: 'auto-fee-'+card.id+'-'+p.id, type:'charge',
        category: card.isInsurance ? 'Insurance' : 'Card Fee',
        amount: p.amount, date: p.date, note: card.name, auto: true
      });
    });
  });
  return rows;
}

// Voucher purchases (UNI, Maxcoins) that carry a stated surcharge post that
// surcharge here automatically, so it's never missed when comparing net cost.
function findSurchargeRule(card, entry){
  const rules = (card.fee && card.fee.surchargeRules) || [];
  return rules.find(r => r.platform && entry.platform && r.platform.toLowerCase()===entry.platform.toLowerCase());
}

function autoVoucherSurcharges(){
  const rows = [];
  cards.forEach(card => {
    card.entries.forEach(e => {
      if(e.type !== 'txn') return;
      if(!e.category || e.category.indexOf('Voucher') !== 0) return;
      // Priority: a confirmed per-brand rate for this card > a one-off stated
      // amount for this specific transaction > the card's old flat assumed
      // rate (kept only as a last-resort, clearly-flagged estimate).
      let amount = null, label = '';
      const brandRule = findSurchargeRule(card, e);
      if(brandRule){
        amount = Math.round(e.amount*brandRule.surchargePct/100*100)/100;
        label = `${card.name} — ${e.platform} (${brandRule.surchargePct}%)`;
      } else if(e.surchargeAmount != null){
        amount = e.surchargeAmount;
        label = `${card.name} — ${e.platform||e.category} (stated once, not yet saved as a rate)`;
      } else if(card.fee && card.fee.voucherSurchargePct){
        amount = Math.round(e.amount*card.fee.voucherSurchargePct/100*100)/100;
        label = `${card.name} — ${e.platform||e.category} (${card.fee.voucherSurchargePct}% assumed, unconfirmed for this brand)`;
      }
      if(amount == null) return;
      rows.push({
        id: 'auto-surcharge-'+card.id+'-'+e.id, type:'charge',
        category: 'Voucher Surcharge', amount, date: e.date, note: label, auto: true
      });
    });
  });
  return rows;
}

/* ---------------- Rewards ---------------- */
// Finds the best-matching reward rule for an entry: exact platform match
// beats category match beats the card's general fallback rate.
function matchRewardRule(card, entry){
  const rules = card.fee.rewardRules || [];
  let best = null;
  rules.forEach(r => {
    const platEq = r.platform && entry.platform && r.platform.toLowerCase()===entry.platform.toLowerCase();
    const catEq = r.category && entry.category && r.category.toLowerCase()===entry.category.toLowerCase();
    let specificity = -1;
    if(r.category && r.platform){ if(catEq && platEq) specificity = 3; }
    else if(r.platform){ if(platEq) specificity = 2; }
    else if(r.category){ if(catEq) specificity = 1; }
    if(specificity > -1 && (!best || specificity > best.specificity)){
      best = { ...r, specificity };
    }
  });
  if(best) return best;
  return { id:'fallback', ratePct: card.fee.rewardRatePct||0, merchantCapAmount: 0, perTxnCapAmount: card.fee.perTxnCapAmount||0 };
}

// Computes the actual reward earned per transaction on a card, applying
// per-transaction caps, per-merchant monthly caps, and the card's overall
// monthly reward cap, in that order, chronologically. Entries with an
// explicit rewardRatePct override (e.g. a stated opening balance) skip
// rule-matching and cap logic.
// Cap tracking key: calendar month by default, or a statement-cycle window
// (billingDate to billingDate) for cards whose caps actually reset with the
// statement rather than the calendar month.
function capPeriodKey(card, dateStr){
  const p = periodParts(dateStr);
  if(card.fee.capResetBasis !== 'statement') return p.y+'-'+p.m;
  const billDay = parseDay(card.billingDate);
  if(!billDay) return p.y+'-'+p.m; // no billing date set — fall back to calendar month
  const d = new Date(dateStr+'T00:00:00');
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < billDay){ m -= 1; if(m<0){ m=11; y-=1; } }
  return 'cycle-'+y+'-'+m;
}

function computeCardRewardEntries(card){
  const entries = card.entries.filter(e=>e.type==='txn');
  const sorted = [...entries].sort((a,b)=> a.date.localeCompare(b.date));
  const merchantMonthUsed = {};
  const cardMonthUsed = {};
  return sorted.map(e => {
    const p = periodParts(e.date);
    const monthKey = capPeriodKey(card, e.date);
    let rate, reward;
    if(e.rewardRatePct != null){
      // Explicit rate override (e.g. a stated opening balance) — skips cap logic entirely.
      rate = e.rewardRatePct;
      reward = e.amount * rate/100;
    } else if(e.rewardAmountOverride != null){
      // A directly-stated reward figure (e.g. "earned ₹352 cashback") — still
      // subject to the normal merchant/card caps, just skipping the rate math.
      rate = null;
      reward = e.rewardAmountOverride;
      const rule = matchRewardRule(card, e);
      if(rule.merchantCapAmount>0){
        const mkey = monthKey+'|'+(rule.id||rule.platform||rule.category||'').toLowerCase();
        const used = merchantMonthUsed[mkey]||0;
        reward = Math.min(reward, Math.max(0, rule.merchantCapAmount-used));
        merchantMonthUsed[mkey] = used+reward;
      }
      if(card.fee.monthlyRewardCap>0){
        const used = cardMonthUsed[monthKey]||0;
        reward = Math.min(reward, Math.max(0, card.fee.monthlyRewardCap-used));
        cardMonthUsed[monthKey] = used+reward;
      }
    } else {
      const rule = matchRewardRule(card, e);
      rate = rule.ratePct;
      reward = e.amount * rate/100;
      if(rule.perTxnCapAmount>0){
        reward = Math.min(reward, rule.perTxnCapAmount);
      }
      if(rule.merchantCapAmount>0){
        const mkey = monthKey+'|'+(rule.id||rule.platform||rule.category||'').toLowerCase();
        const used = merchantMonthUsed[mkey]||0;
        reward = Math.min(reward, Math.max(0, rule.merchantCapAmount-used));
        merchantMonthUsed[mkey] = used+reward;
      }
      if(card.fee.monthlyRewardCap>0){
        const used = cardMonthUsed[monthKey]||0;
        reward = Math.min(reward, Math.max(0, card.fee.monthlyRewardCap-used));
        cardMonthUsed[monthKey] = used+reward;
      }
    }
    return { entry:e, monthKey, rate, reward };
  });
}

function renderRewards(){
  const app = document.getElementById('app');
  if(!app) return;
  if(!Array.isArray(cards)) cards=[];
  cards.forEach(c=>{ if(!Array.isArray(c.entries)) c.entries=[]; if(c.fee && typeof c.fee!=='object') c.fee=null; });
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const curMonthKey = curY+'-'+curM;
  const rewardCards = cards.filter(c => c.name!==DEBIT_CARD_NAME && !c.isInsurance && c.fee);

  let totalMonth=0, totalYear=0, totalLifetime=0;
  const capProgress = []; // cards with an active monthly cap, for the progress panel

  rewardCards.forEach(c => {
    const computed = computeCardRewardEntries(c);
    const cardCurPeriodKey = capPeriodKey(c, todayStr());
    computed.forEach(({entry, monthKey, reward}) => {
      const p = periodParts(entry.date);
      totalLifetime += reward;
      if(p.y===curY) totalYear += reward;
      if(p.y===curY && p.m===curM) totalMonth += reward;
    });
    if(c.fee.monthlyRewardCap>0){
      const usedThisMonth = computed.filter(x=>x.monthKey===cardCurPeriodKey).reduce((s,x)=>s+x.reward,0);
      capProgress.push({ name:c.name, label: c.fee.capResetBasis==='statement' ? 'Card-wide cap (statement cycle)' : 'Card-wide cap', used:usedThisMonth, cap:c.fee.monthlyRewardCap });
    }
    (c.fee.rewardRules||[]).filter(r=>r.merchantCapAmount>0).forEach(r => {
      const usedThisMonth = computed
        .filter(x => x.monthKey===cardCurPeriodKey && x.entry.platform && r.platform && x.entry.platform.toLowerCase()===r.platform.toLowerCase())
        .reduce((s,x)=>s+x.reward,0);
      capProgress.push({ name:c.name, label: r.platform+(c.fee.capResetBasis==='statement' ? ' cap (statement cycle)' : ' cap'), used:usedThisMonth, cap:r.merchantCapAmount });
    });
  });

  let html = `<div class="cover">\n
    <div class="cover-figures">
      <div class="cover-line"><span class="cover-label">This month</span><span class="cover-amt">${inr(totalMonth)}</span></div>
      <div class="cover-line"><span class="cover-label">This year</span><span class="cover-amt">${inr(totalYear)}</span></div>
      <div class="cover-line"><span class="cover-label">Lifetime</span><span class="cover-amt total">${inr(totalLifetime)}</span></div>
    </div>
    <div class="stamp"><span class="pct">★</span><span class="cap">rewards</span></div>
  </div>`;

  const unconfirmed = rewardCards.filter(c => !c.fee.rewardRateConfirmed && c.entries.some(e=>e.type==='txn'));
  if(unconfirmed.length){
    html += `<div class="panel">
      <h2>Reward rate not confirmed</h2>
      <div class="sub">These cards have logged spend but no confirmed reward rate — currently assumed at ${unconfirmed[0].fee.rewardRatePct}%, which is likely inaccurate. Tell me the real rate and I'll fix it everywhere at once.</div>
      <div>${unconfirmed.map(c=>`<div class="dues-row" style="grid-template-columns:1fr;"><div class="dues-name">${c.name}</div></div>`).join('')}</div>
    </div>`;
  }

  if(capProgress.length){
    html += `<div class="panel">
      <h2>Reward caps this month</h2>
      <div class="sub">Once a cap is hit, further spend in that bucket stops earning until next month</div>`;
    capProgress.forEach(cp => {
      const pct = cp.cap>0 ? Math.min(100, Math.round(cp.used/cp.cap*100)) : 0;
      html += `<div class="recur-row">
        <div class="recur-head">
          <div class="recur-name" style="font-size:14px;">${cp.name}<span class="share-tag">${cp.label}</span></div>
          <div class="row-sub">${inr(cp.used)} / ${inr(cp.cap)}</div>
        </div>
        <div class="bar-track"><div class="bar-fill ${pct>=100?'over':pct>=70?'warn':''}" style="width:${pct}%"></div></div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="panel">
    <div class="disclaimer">Estimated from each card's category/merchant rules (set per card in Card Fees), falling back to its general rate where nothing more specific applies, with monthly and per-merchant caps enforced automatically.</div>
  </div>`;

  html += renderRewardTrackingManager();
  app.innerHTML = html;
}

if('serviceWorker' in navigator){
  // Automatic PWA updates. The versioned service-worker URL forces a fresh
  // update check on every release, while the checks below catch updates
  // published while the PWA is already open.
  let appReloadingForUpdate=false;
  const reloadOnControllerChange=()=>{
    if(appReloadingForUpdate) return;
    appReloadingForUpdate=true;
    window.location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange',reloadOnControllerChange);

  const checkForAppUpdate=async()=>{
    try{
      // Always register the versioned worker URL. Do not reuse an older
      // registration blindly, otherwise a new APP_VERSION can remain on the
      // old service-worker script forever.
      const reg=await navigator.serviceWorker.register(
        './sw.js?app='+encodeURIComponent(APP_VERSION),
        {updateViaCache:'none'}
      );
      await reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(e){}
  };

  navigator.serviceWorker.addEventListener('message',event=>{
    const data=event.data||{};
    if(data.type==='CHECK_STATEMENT_NOTIFICATIONS') checkStatementNotifications();
    if(data.type==='OPEN_STATEMENT_CARD'){
      activeTab='dues';
      render();
    }
  });

  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?app='+encodeURIComponent(APP_VERSION),{updateViaCache:'none'});
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker) return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed' && navigator.serviceWorker.controller){
            worker.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
      await reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(e){}
    setTimeout(checkForAppUpdate,1500);
    setInterval(checkForAppUpdate,5*60*1000);
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') checkForAppUpdate();
    });
    window.addEventListener('focus',checkForAppUpdate);
  });
}
